            B.fs.mordor || B.fs.revealed,
          );
          if (m === PENDING) return;
          if (!m)
            return auto(
              false,
              "Fellowship not on the Mordor track or revealed",
            );
        }
        if (cards) return auto(hc.C > 0, "Character cards: " + hc.C);
        return ask(
          S,
          n,
          "Character cards > 0? (the Fellowship is on the Mordor track or revealed)",
        );
      case "C5.wkNotMob":
      case "M5.wkNotMob":
      case "CH.wkJoin":
        if (T && !B.chars.witchKing)
          return auto(false, "Witch King not in play");
        return ask(S, n);
      case "C5.minion":
      case "M5.minion": {
        // bold part: a minion can be mustered; plain part: Muster 2 can still advance a nation or recruit a faction
        if (!T) break;
        if (w.sub === 0) {
          const m = Q.minionsAvailable(S);
          if (m.length)
            return decided(
              S,
              text(n),
              true,
              true,
              true,
              m[0].name + ": " + m[0].why,
            );
          trail(S, {
            kind: "q",
            text: text(n),
            answer: "No",
            auto: true,
            why: "no minion can be mustered (tracker)",
          });
          w.sub = 1;
        }
        const seNot = !Q.snAtWar(S, "se"),
          noFac = S.settings.wome && !Q.shadowFactionInPlay(S);
        let why =
          "S&E at war" + (S.settings.wome ? ", a faction is in play" : "");
        if (seNot) why = "Southrons & Easterlings not at war";
        else if (noFac) why = "no faction recruited";
        return decided(S, x.t2, false, seNot || noFac, true, why);
      }
      case "C5.mordorWin": {
        if (w.sub === 0) {
          if (T && B.fs.mordor)
            return decided(
              S,
              text(n),
              true,
              true,
              true,
              "Fellowship on the Mordor track",
            );
          return ask(S, n, "*Target* would win the game", {
            sub: 1,
            bold: true,
          });
        }
        return ask(S, n, x.t2, { sub: 2 });
      }
      case "C5.playChar":
        if (cards)
          return playableCount(handC(), "event", "playable Character card");
        return ask(S, n);
      case "C5.allFac":
        if (facKnown) return auto(Q.allShadowFactionsInPlay(S), "tracker");
        return ask(S, n);
      case "M5.revCard":
        if (cards)
          return playableCount(
            handC().filter((i) => byId[i].revealed),
            "event",
            "playable “Fellowship revealed” card",
          );
        return ask(S, n);
      case "M5.playMuster":
      case "MU.musterCard":
        if (cards)
          return playableCount(
            handS().filter((i) => byId[i].type === "Muster"),
            "event",
            "playable Muster card",
          );
        return ask(S, n);
      case "M5.anyCond":
        if (T && B.fs.mordor) return auto(true, "Fellowship is in Mordor");
        return ask(S, n, null, { items: x.items, any: true });
      // ---- Character
      case "CH.nazInPlay":
        return bauto(
          B.chars.witchKing || B.nazgul > 0,
          "tracker: " +
            B.nazgul +
            " Nazgûl" +
            (B.chars.witchKing ? ", Witch King in play" : ""),
        );
      // CH.wkJoin shares the Witch King check with C5/M5.wkNotMob above.
      case "CH.nazFs":
      case "CH.nazJoin":
        if (T && B.nazgul === 0) return auto(false, "no Nazgûl on the map");
        return ask(S, n);
      case "CH.mosMob":
        if (T && !B.chars.mouth)
          return auto(false, "Mouth of Sauron not in play");
        return ask(S, n);
      case "CH.dieUsed":
        return auto(w.dieUsed, w.dieUsed ? "a move was made" : "nothing moved");
      // ---- Army
      case "AR.huntDice":
        if (dice && S.dice.hunt === 0)
          return auto(false, "no dice in the Hunt box");
        if (T && B.fs.mordor) return auto(false, "Fellowship in Mordor");
        return ask(S, n);
      // ---- Muster
      case "MU.minion": {
        const m = Q.minionsAvailable(S);
        return bauto(
          m.length > 0,
          m.length
            ? m[0].name + ": " + m[0].why
            : "no minion can be mustered (tracker)",
        );
      }
      case "MU.wotw":
        if (w.fromReserve)
          return auto(
            false,
            "the die set aside for the minion must be used now (Rulings)",
          );
        if (
          T &&
          (B.chars.gandalfWhite ||
            B.chars.saruman ||
            B.chars.witchKing ||
            B.chars.mouth)
        )
          return auto(
            false,
            B.chars.gandalfWhite
              ? "Gandalf the White is in play"
              : "a minion is already in play",
          );
        return ask(S, n);
      case "MU.notWar": {
        if (!T) return ask(S, n);
        const nw = !Q.snAllAtWar(S);
        const nf = S.settings.wome && !Q.shadowFactionInPlay(S);
        let why = "all at war" + (S.settings.wome ? ", faction in play" : "");
        if (nw) why = "a Shadow nation is not at war";
        else if (nf) why = "no faction in play";
        return auto(nw || nf, why);
      }
      case "MU.facTop":
        return auto(
          w.nationChoice === "Faction",
          "priority chose " + (w.nationChoice || "nothing"),
        );
      // MU.musterCard shares the playable Muster card count with M5.playMuster above.
      case "MU.cardChoice":
        if (cards && w.chosen)
          return auto(
            !!Q.MUSTER_CHOICE[w.chosen],
            "card: " + byId[w.chosen].title,
          );
        return ask(S, n);
      case "MU.sixNaz":
        return bauto(B.nazgul < 6, B.nazgul + " Nazgûl on the map");
      // ---- Event
      case "EV.prefPlay":
        if (cards)
          return playableCount(
            S.cards.hand
              .concat(S.cards.factionHand)
              .filter((i) => Q.cardFlags(byId[i], S).preferred),
            "event",
            "playable *preferred* card",
          );
        return ask(S, n);
      case "EV.eventDie":
        if (w.die)
          return auto(w.die === "Event", "using a " + DIE_NAME[w.die] + " die");
        return ask(S, n);
      case "EV.less4":
      case "EV.less4b":
        if (cards)
          return auto(hc.total < 4, "Event cards in hand: " + hc.total);
        return ask(S, n);
      case "EV.less3f":
        if (cards) return auto(hc.F < 3, "Faction cards: " + hc.F);
        return ask(S, n);
      case "EV.anyPlay":
        if (cards)
          return playableCount(
            S.cards.hand.concat(S.cards.factionHand),
            "event",
            "playable card",
          );
        return ask(S, n);
      case "EV.aboveFull":
        if (cards)
          return auto(
            hc.total > 6 || hc.F > 4,
            "hand " +
              hc.total +
              "/6" +
              (S.settings.wome ? ", faction " + hc.F + "/4" : ""),
          );
        return ask(S, n);
      case "EV.revCard":
        if (cards)
          return playableCount(
            handC().filter((i) => byId[i].revealed),
            "event",
            "card",
          );
        return ask(S, n);
      case "EV.corrCard":
        if (cards)
          return playableCount(
            S.cards.hand.filter((i) => byId[i].corruption || byId[i].tile),
            "event",
            "card",
          );
        return ask(S, n);
      // ---- Faction
      case "FA.playable":
        if (cards)
          return playableCount(
            S.cards.factionHand,
            "event",
            "playable Faction Event card",
          );
        return ask(S, n);
      case "FA.blackSails":
        if (cards)
          return auto(
            S.cards.factionTable.includes("sa_Faction03") &&
              B.factions.corsairs,
            "table",
          );
        return ask(S, n);
      case "FA.playDie":
        if (w.die) return auto(w.die === "FPlay", "using " + DIE_NAME[w.die]);
        return ask(S, n);
      case "FA.aboveFull":
        if (cards) return auto(hc.F > 4, "faction hand " + hc.F + "/4");
        return ask(S, n);
      case "FA.eligible":
        if (w.factionChoice)
          return ask(
            S,
            n,
            "Are the " + w.factionChoice + " eligible to be brought into play?",
          );
        if (cards || T) return auto(false, "every faction is already in play");
        return ask(S, n);
      // ---- Battle
      case "BA.playChar":
        if (cards)
          return playableCount(
            Q.combatCandidates(S).filter((i) => byId[i].deck === "C"),
            "combat",
            "usable Character card",
          );
        return ask(S, n);
      case "BA.wkFirst":
        if (w.battleRound !== 1) return auto(false, "not the first round");
        if (T && !B.chars.witchKing)
          return auto(false, "Witch King not in play");
        return ask(
          S,
          n,
          "Army includes the Witch King (this is the first round)",
        );
      case "BA.more4":
        if (cards)
          return auto(hc.total > 4, "Event cards in hand: " + hc.total);
        return ask(S, n);
      case "BA.ctb":
        if (!S.settings.wome) return auto(false, "WoME not in play");
        if (cards) {
          const r = evalPlayable(S, Q.ctbCards(S), "combat");
          if (r === PENDING) return;
          w.ctb = r;
          return auto(
            r.length > 0,
            r.length +
              " usable Call to Battle card" +
              (r.length === 1 ? "" : "s"),
          );
        }
        return ask(S, n);
      case "BA.round1":
        return auto(w.battleRound === 1, "round " + w.battleRound);
      case "BA.fieldOrMil":
        if (S.strategy === "military") return auto(true, "military strategy");
        if (T && B.fs.mordor)
          return auto(true, "Fellowship on the Mordor track");
        return ask(
          S,
          n,
          "Field battle? (not military strategy; Fellowship not on the Mordor track)",
        );
      case "BA.aggrCont":
        if (T && B.fs.mordor)
          return auto(true, "Fellowship on the Mordor track");
        return ask(S, n);
      case "BA.anyCond":
        return ask(S, n, null, { items: x.items, any: true });
    }
    if (x.t2 && !x.any) {
      // two-part decision: the bold (ring) part first, then the plain part
      if (w.sub === 0) return ask(S, n, text(n), { sub: 1, bold: true });
      return ask(S, n, x.t2, { sub: 2 });
    }
    return ask(S, n, null, x.any ? { items: x.items, any: true } : null);
  }

  // ----- playability evaluation with lazy prompts -----
  // A card's precondition in this context: the combat test in a battle, the board test when the tracker is on, otherwise taken as met.
  function playablePre(S, c, id, ctx) {
    if (ctx === "combat") return Q.combatPre(c, S);
    return S.settings.tracker ? Q.precondition(id, S) : true;
  }
  function evalPlayable(S, ids, ctx) {
    const out = [];
    for (const id of ids) {
      const c = byId[id];
      const cacheKey = (ctx === "combat" ? "B:" : "") + id;
      if (S.playable[cacheKey] !== undefined) {
        if (S.playable[cacheKey]) out.push(id);
        continue;
      }
      let pre = playablePre(S, c, id, ctx);
      if (pre && typeof pre === "object") {
        setPrompt(S, { type: "situ", key: pre.situ, text: pre.q });
        return PENDING;
      }
      if (!pre) {
        S.playable[cacheKey] = false;
        continue;
      }
      setPrompt(S, { type: "confirm", card: id, ctx });
      return PENDING;
    }
    return out;
  }

  // ----- jumps -----
  function handleJump(S, n) {
    const w = S.walk,
      spec = jumpSpec(text(n)),
      label = norm(text(n));
    if (!spec) {
      trail(S, { kind: "skip", text: label, why: "unknown box" });
      exitJump(S);
      return;
    }
    if (extra(n).wome && !S.settings.wome) {
      trail(S, { kind: "skip", text: label, why: "WoME not in play" });
      exitJump(S);
      return;
    }
    const handler = JUMP_KIND[spec.kind];
    if (handler) handler(S, w, spec, label);
    else jumpWithDie(S, spec, label);
  }
  // "Switch to military/Corruption": change strategy and either end the walk or restart it on the other strategy's page (rule 40).
  function switchStrategy(S, w, spec, label) {
    S.strategy = spec.strategy;
    Q.log(S, "Strategy changed to " + spec.strategy + " (rule 40).");
    trail(S, { kind: "jump", text: label });
    if (spec.endWalk) {
      endWalk(S, "phase:" + spec.endWalk, spec.text);
      return;
    }
    goto(S, spec.page, findStart(spec.page, spec.start));
    w.trail[0] = {
      kind: "start",
      text: spec.start,
      page: spec.page,
      node: w.node,
    };
    follow(S, null);
  }
  // "Save muster die for minion": set the die aside and return to the calling page.
  function reserveDie(S, w, spec, label) {
    // A die already set aside and brought back by "Use Muster die set aside for minion" must be used now (Rulings), not set aside again.
    if (w.fromReserve) {
      trail(S, {
        kind: "skip",
        text: label,
        why: "this die was already set aside — it must be used now",
      });
      exitJump(S);
      return;
    }
    S.minionReserved = true;
    if (w.dieObj != null && S.settings.dice) {
      S.dice.pool[w.dieObj].st = Q.DIE_STATE.RESERVED;
    }
    delete w.dieAns.Muster;
    delete w.dieAns.CharOrMuster; // the die the player said Queller had is no longer available
    Q.log(S, "Muster die set aside for a minion (Rulings).");
    trail(S, { kind: "note", text: "Muster die set aside for a minion" });
    w.dieObj = null;
    w.die = null;
    doReturn(S);
  }
  // "Phase 5 (use a ring)": restart the walk looking for a ring use (rule 37) when a ring and a die to change are available.
  function ringAnyJump(S, w, spec, label) {
    const can =
      w.mode !== "ringAny" &&
      Q.ringAvailable(S) &&
      (!S.settings.dice || Q.availDice(S).some((d) => d.k === "A"));
    if (can) {
      trail(S, { kind: "jump", text: label });
      const entry = w.entry;
      w.done = true;
      S.walk = null;
      startWalk(S, entry.page, entry.start, { mode: "ringAny" });
      return;
    }
    let why = "no die to change";
    if (S.ringUsedThisTurn) why = "a ring was already used this turn";
    else if (Q.ringsKnown(S) && !S.board.rings) why = "no Elven Ring";
    trail(S, { kind: "skip", text: label, why });
    exitJump(S);
  }
  // Grey boxes that do not name a page, by the `kind` of their JUMPS entry; a page name goes through jumpWithDie instead.
  const JUMP_KIND = {
    return: (S, w, spec, label) => {
      trail(S, { kind: "ret", text: label });
      doReturn(S);
    },
    endPhase4: (S) =>
      endWalk(S, "phase:Phase 5", "Phase 5 begins — you act first."),
    battleNext: (S) =>
      endWalk(
        S,
        "battleNext",
        "Another combat round: walk again from “Battle (next round)”.",
      ),
    switch: switchStrategy,
    reserve: reserveDie,
    ringAny: ringAnyJump,
  };
  // Grey box naming a page: enter it with the die it needs (or the die already held), or skip it.
  function jumpWithDie(S, spec, label) {
    const w = S.walk;
    if (Q.dieSatisfies(w.die, spec.die)) {
      enterPage(S, spec, label);
      return;
    }
    const ok = ensureDie(S, spec.die, label);
    if (ok === PENDING) return;
    if (ok) enterPage(S, spec, label);
    else exitJump(S);
  }
  // Make sure Queller has a die of type `req` for the step `label`. Returns true (use it), false (skipped, trail written), or PENDING (prompt open).
  function ensureDie(S, req, label) {
    const w = S.walk;
    if (w.pendingDie === label) {
      w.pendingDie = null;
      const ok = w.dieAns[req];
      w.ringArmed = false;
      if (!ok)
        trail(S, {
          kind: "skip",
          text: label,
          why: "no " + DIE_NAME[req] + " die",
        });
      return !!ok;
    }
    if (S.settings.dice) return ensureDieFromPool(S, w, req, label);
    return askForDie(S, w, req, label);
  }
  // With dice rolled by the app: take a matching die from the pool, changing one with an Elven Ring when that is armed.
  function ensureDieFromPool(S, w, req, label) {
    let d = Q.findDie(S, req);
    if (!d && ringPossible(S)) {
      d = Q.ringChange(S, req);
      if (d)
        trail(S, {
          kind: "ring",
          text: "Elven Ring: die changed to " + d.face,
        });
    }
    w.ringArmed = false;
    if (!d) {
      trail(S, {
        kind: "skip",
        text: label,
        why: "no " + DIE_NAME[req] + " die available",
      });
      return false;
    }
    w.dieObj = S.dice.pool.indexOf(d);
    return true;
  }
  // Without dice: ask the player whether Queller has the die (once per type per walk), then offer an Elven Ring before giving up.
  function askForDie(S, w, req, label) {
    if (w.dieAns[req] === undefined) {
      setPrompt(S, {
        type: "diecheck",
        req,
        label,
        text:
          "Does Queller have " +
          aDie(req) +
          " die available" +
          (req === "Army" || req === "Muster"
            ? " (an Army/Muster die counts)"
            : "") +
          "?",
      });
      return PENDING;
    }
    if (w.dieAns[req]) {
      w.ringArmed = false;
      return true;
    }
    if (ringPossible(S) && !w.ringAsked) {
      w.ringAsked = true;
      setPrompt(S, {
        type: "ring",
        req,
        label,
        text:
          (Q.ringsKnown(S) ? "" : "If the Shadow holds an Elven Ring: ") +
          "Use an Elven Ring (rule 36): change one Queller die that does not show a *preferred* result into " +
          aDie(req) +
          " result. Choose the die at random.",
      });
      return PENDING;
    }
    w.ringArmed = false;
    trail(S, {
      kind: "skip",
      text: label,
      why: "no " + DIE_NAME[req] + " die",
    });
    return false;
  }
  function ringPossible(S) {
    const w = S.walk;
    return Q.ringAvailable(S) && (w.ringArmed || w.mode === "ringAny");
  }
  function enterPage(S, spec, label) {
    const w = S.walk;
    w.stack.push({
      page: w.page,
      node: w.node,
      die: w.die,
      dieObj: w.dieObj,
      dieUsed: w.dieUsed,
    });
    if (!Q.dieSatisfies(w.die, spec.die)) w.die = spec.die;
    trail(S, { kind: "jump", text: label, die: DIE_NAME[w.die] });
    w.ringAsked = false;
    w.cands = null;
    w.chosen = null;
    w.steps = null;
    goto(S, spec.page, findStart(spec.page, spec.start));
    follow(S, null);
  }
  function exitJump(S) {
    // follow the arrow out of the current grey box; if none, return further
    if (!follow(S, null)) doReturn(S);
  }
  function doReturn(S) {
    const w = S.walk;
    if (!w.stack.length) {
      // A die brought back from "set aside for a minion" that found no action is spent, not set aside again (Rulings: it cannot be used for anything else).
      if (
        w.fromReserve &&
        S.settings.dice &&
        w.reserveDieObj != null &&
        S.dice.pool[w.reserveDieObj].st === Q.DIE_STATE.AVAIL
      ) {
        Q.spendDie(
          S,
          S.dice.pool[w.reserveDieObj],
          "set aside for a minion, no action possible",
        );
        endWalk(
          S,
          "action",
          "Queller sets aside the Muster die it had kept for a minion — no action was possible with it.",
        );
        return;
      }
      endWalk(
        S,
        "noaction",
        w.page === "BA"
          ? "Nothing further from the Battle page this round."
          : "Queller has no action from this walk.",
      );
      return;
    }
    const fr = w.stack.pop();
    goto(S, fr.page, fr.node);
    w.die = fr.die;
    w.dieObj = fr.dieObj;
    w.dieUsed = fr.dieUsed;
    w.cands = null;
    w.chosen = null;
    trail(S, { kind: "back", text: norm(text(cur(S))) });
    exitJump(S);
  }

  // ----- actions -----
  // Draw steps and actions on the Event/Faction pages: the deck depends on the box; with cards off the player draws.
  // The deck a draw node draws from: Character or Faction Event where the node says so, otherwise the strategy's preferred deck.
  function drawDeck(S, key) {
    if (key === "EV.drawChar") return "C";
    if (key === "EV.drawFac" || key === "FA.drawT") return "F";
    return S.strategy === "corruption" ? "C" : "S";
  }
  function drawStep(S, n, key) {
    const w = S.walk,
      txt = norm(text(n)),
      isStep = kind(n) === "T";
    if (!S.settings.cards)
      return setPrompt(S, {
        type: isStep ? "step" : "action",
        text: txt,
        node: w.node,
      });
    const deck = drawDeck(S, key);
    const id = Q.drawCard(S, deck);
    trail(S, {
      kind: "note",
      text:
        "Drew a " + Q.deckName(deck) + " card" + (id ? "" : " — deck empty"),
    });
    if (isStep) {
      follow(S, null);
      return;
    }
    const hc = Q.handCounts(S);
    setPrompt(S, {
      type: "action",
      text:
        txt +
        " — done: Queller now holds " +
        hc.total +
        " Event card" +
        (S.settings.wome ? "s and " + hc.F + " Faction Event card" : "") +
        "s.",
      node: w.node,
      auto: true,
    });
  }
  function handleAction(S, n) {
    const w = S.walk,
      key = w.page + "." + w.node,
      txt = norm(text(n)),
      x = extra(n),
      cards = S.settings.cards,
      dice = S.settings.dice;
    if (x.die && !(w.die === x.die && w.dieObj != null)) {
      const ok = ensureDie(S, x.die, txt);
      if (ok === PENDING) return;
      if (!ok) {
        exitAction(S);
        return;
      }
      w.die = x.die;
    }
    switch (key) {
      case "C14.sogCorr":
      case "M14.sogCorr":
        S.strategy = "corruption";
        Q.log(S, "Queller uses the corruption strategy.");
        endWalk(S, "strategy", "Queller uses the corruption strategy.");
        return;
      case "C14.sogMil":
      case "M14.sogMil":
        S.strategy = "military";
        Q.log(S, "Queller uses the military strategy.");
        endWalk(S, "strategy", "Queller uses the military strategy.");
        return;
      case "C5.discardDie":
      case "M5.discardDie":
        if (dice) {
          const av = Q.availDice(S);
          if (!av.length) {
            trail(S, {
              kind: "skip",
              text: txt,
              why: "no die left to discard",
            });
            exitAction(S);
            return;
          }
          const d = Q.pick(av);
          d.st = Q.DIE_STATE.USED;
          Q.log(
            S,
            "Discarded an unplayable " + d.face + " die at random (rule 32).",
          );
          endWalk(
            S,
            "action",
            "Queller sets aside a " +
              d.face +
              " die it could not use (rule 32).",
          );
          return;
        }
        return setPrompt(S, {
          type: "action",
          text: "Discard unplayable die: set aside one Queller die that could not be used, chosen at random (rule 32).",
          node: w.node,
        });
      case "C5.minionDie":
      case "M5.minionDie": {
        const reserved = dice
          ? S.dice.pool.find((z) => z.st === Q.DIE_STATE.RESERVED)
          : null;
        if (dice ? !reserved : !S.minionReserved) {
          trail(S, { kind: "skip", text: txt, why: "no Muster die set aside" });
          endWalk(
            S,
            "noaction",
            "Queller has no action — it has no die it can use.",
          );
          return;
        }
        let obj = null;
        if (dice) {
          reserved.st = Q.DIE_STATE.AVAIL;
          obj = S.dice.pool.indexOf(reserved);
          S.minionReserved = S.dice.pool.some(
            (z) => z.st === Q.DIE_STATE.RESERVED,
          );
        } else S.minionReserved = false;
        w.fromReserve = true;
        w.reserveDieObj = obj;
        trail(S, {
          kind: "jump",
          text: "Muster 2 (die set aside for the minion)",
        });
        w.stack.push({
          page: w.page,
          node: w.node,
          die: null,
          dieObj: null,
          dieUsed: false,
        });
        w.die = "Muster";
        w.dieObj = obj;
        goto(S, "MU", findStart("MU", "Muster 2"));
        follow(S, null);
        return;
      }
      case "C5.pass":
      case "M5.pass":
        return setPrompt(S, {
          type: "action",
          text: "Pass",
          node: w.node,
          pass: true,
          help: "Only if the game rules permit a pass (Rulings). If Queller cannot pass, follow the arrow out.",
        });
      case "EV.drawPref":
      case "EV.drawChar":
      case "EV.drawFac":
        return drawStep(S, n, key);
      case "EV.discard":
      case "FA.discard": {
        if (cards && w.discards) {
          if (w.die) spendCurrentDie(S, "drew a card");
          endWalk(S, "action", "Discarded down to the hand limit.");
          return;
        }
        return setPrompt(S, {
          type: "action",
          text: "Discard the card chosen by the priority list.",
          node: w.node,
        });
      }
      case "EV.playA":
      case "EV.playB":
      case "EV.playC":
      case "EV.playD":
      case "FA.playA":
      case "MU.musterCardA":
      case "M5.playCharDie":
      case "M5.playEventDie": {
        if (cards && !w.chosen && w.cands?.length) {
          const r = Q.applyPriority(S, w.cands, [
            "Ascending order of initiative",
          ]);
          w.chosen = r.chosen;
          w.steps = r.steps;
        }
        if (cards && w.chosen) {
          return setPrompt(S, {
            type: "playcard",
            card: w.chosen,
            text: txt,
            node: w.node,
          });
        }
        return setPrompt(S, { type: "action", text: txt, node: w.node });
      }
      case "MU.musterE":
      case "MU.musterEnd": {
        if (cards && w.chosen) {
          return setPrompt(S, {
            type: "playcard",
            card: w.chosen,
            text: "Muster with the card",
            node: w.node,
          });
        }
        break;
      }
      case "MU.polTrack": {
        if (!w.nationChoice || w.nationChoice === "Faction") {
          trail(S, { kind: "skip", text: txt, why: "no nation to advance" });
          exitAction(S);
          return;
        }
        const k = SN_KEY[w.nationChoice];
        if (!S.settings.tracker)
          return setPrompt(S, {
            type: "action",
            text:
              "Move " + w.nationChoice + " down one on the Political Track.",
            node: w.node,
          });
        const now = S.board.nations[k] | 0,
          next = Math.max(0, now - 1);
        return setPrompt(S, {
          type: "action",
          text:
            "Move " +
            w.nationChoice +
            " down one on the Political Track (" +
            Q.snLabel(now) +
            " → " +
            Q.snLabel(next) +
            ").",
          node: w.node,
          nation: k,
        });
      }
      case "MU.musterMinion":
        if (!w.minionPick) {
          trail(S, {
            kind: "skip",
            text: txt,
            why: "no minion can be mustered",
          });
          exitAction(S);
          return;
        }
        return setPrompt(S, {
          type: "action",
          text: "Muster " + w.minionPick + ".",
          node: w.node,
          minion: {
            Saruman: "saruman",
            "Witch King": "witchKing",
            "Mouth of Sauron": "mouth",
          }[w.minionPick],
        });
      case "FA.bringIn":
        if (w.factionChoice)
          return setPrompt(S, {
            type: "action",
            text: "Bring the " + w.factionChoice + " into play.",
            node: w.node,
            faction: w.factionChoice.toLowerCase(),
          });
        if (cards || S.settings.tracker) {
          trail(S, { kind: "skip", text: txt, why: "no faction to bring in" });
          exitAction(S);
          return;
        }
        break;
    }
    if (/^End( action)?$/.test(txt)) {
      endWalk(
        S,
        w.die ? "action" : "end",
        "End of " + (w.die ? "action" : "walk") + ".",
      );
      if (w.die) spendCurrentDie(S, "end of action");
      return;
    }
    setPrompt(S, { type: "action", text: txt, node: w.node, help: x.help });
  }
  function spendCurrentDie(S, why) {
    const w = S.walk;
    if (!w?.die) return;
    if (S.settings.dice && w.dieObj != null) {
      Q.spendDie(S, S.dice.pool[w.dieObj], why);
    } else
      Q.log(
        S,
        "Queller used a " +
          DIE_NAME[w.die] +
          " die" +
          (why ? " — " + why : "") +
          ".",
      );
    w.die = null;
    w.dieObj = null;
  }
  function exitAction(S) {
    // rule 29
    if (follow(S, null)) return;
    doReturn(S);
  }

  // ----- steps (orange) -----
  function handleStep(S, n) {
    const w = S.walk,
      key = w.page + "." + w.node,
      txt = norm(text(n)),
      x = extra(n),
      dice = S.settings.dice,
      cards = S.settings.cards;
    const cont = (note) => {
      trail(S, { kind: "step", text: txt, auto: true, why: note });
      follow(S, null);
    };
    switch (key) {
      case "C14.rec":
      case "M14.rec":
        if (dice) {
          Q.recoverDice(S);
          return cont("pool: " + S.dice.pool.length + " dice");
        }
        return setPrompt(S, {
          type: "step",
          text:
            "Recover Queller’s action dice" +
            (S.settings.wome
              ? " (and the Faction die if a Shadow faction is in play)"
              : "") +
            ".",
          node: w.node,
        });
      case "C14.draw":
      case "M14.draw":
        if (cards) {
          Q.drawCard(S, "C");
          Q.drawCard(S, "S");
          if (S.settings.wome) Q.drawCard(S, "F");
          return cont(
            "hand: " +
              Q.handCounts(S).total +
              (S.settings.wome ? " + " + Q.handCounts(S).F + " faction" : ""),
          );
        }
        return setPrompt(S, {
          type: "step",
          text:
            "Draw one Character and one Strategy Event card for Queller" +
            (S.settings.wome ? ", and one Faction Event card" : "") +
            ".",
          node: w.node,
        });
      case "C14.disc14":
      case "C14.disc18":
      case "M14.disc":
        if (cards) {
          const d = Q.autoDiscard(S, x.items, "E");
          return cont(
            "discarded " + d.map((i) => "“" + byId[i].title + "”").join(", "),
          );
        }
        return setPrompt(S, {
          type: "step",
          text: txt,
          items: x.items,
          node: w.node,
        });
      case "C14.discF":
      case "M14.discF":
        if (cards) {
          const d = Q.autoDiscard(S, x.items, "F");
          return cont(
            "discarded " + d.map((i) => "“" + byId[i].title + "”").join(", "),
          );
        }
        return setPrompt(S, {
          type: "step",
          text: txt,
          items: x.items,
          node: w.node,
        });
      case "C14.rollHunt":
        if (dice) {
          const r = Q.rnd(6) + 1;
          const k = r <= 3 ? 0 : 1;
          Q.log(
            S,
            "Rolled " + r + " for the hunt allocation → " + k + " dice.",
          );
          Q.assignHunt(S, k);
          return cont("rolled " + r + " → " + k + " in the Hunt box");
        }
        return setPrompt(S, { type: "step", text: txt, node: w.node });
      case "C14.huntMax":
      case "M14.huntMax":
        if (dice) {
          const k = Q.assignHunt(S, Q.huntCap(S));
          return cont(
            k + " dice (Companions: " + (S.board.fs.companions | 0) + ")",
          );
        }
        return setPrompt(S, {
          type: "step",
          text: txt + " (up to the number of Companions, minimum 1).",
          node: w.node,
        });
      case "C14.hunt1a":
      case "C14.hunt1b":
      case "M14.hunt1":
        if (dice) {
          Q.assignHunt(S, 1);
          return cont();
        }
        break;
      case "C14.hunt2a":
      case "C14.hunt2b":
      case "M14.hunt2":
        if (dice) {
          const k = Q.assignHunt(S, 2);
          return cont(
            k < 2
              ? "capped at " +
                  k +
                  " (rule 34: " +
                  (S.board.fs.companions | 0) +
                  " Companions)"
              : undefined,
          );
        }
        break;
      case "M14.hunt0":
        if (dice) {
          Q.log(S, "No dice placed in the Hunt box before rolling.");
          return cont();
        }
        break;
      case "C14.rollRest":
      case "M14.rollRest":
        if (dice) {
          const r = Q.rollRemaining(S);
          return cont(r.join(", "));
        }
        return setPrompt(S, {
          type: "step",
          text: "Roll Queller’s remaining action dice. Put every Eye in the Hunt box.",
          node: w.node,
        });
      case "C14.sogRoll":
      case "M14.sogRoll":
        if (dice) {
          const r = Q.rnd(6) + 1;
          Q.log(S, "Strategy roll: " + r + ".");
          trail(S, {
            kind: "step",
            text: "Roll a die",
            auto: true,
            why: "rolled " + r,
          });
          follow(S, r <= 3 ? "1-3" : "4-6");
          return;
        }
        return setPrompt(S, {
          type: "roll",
          text: "Roll a die: 1-3 corruption strategy, 4-6 military strategy.",
          node: w.node,
          options: ["1-3", "4-6"],
        });
      case "BA.playCard":
        if (cards) {
          if (w.chosen) {
            return setPrompt(S, {
              type: "playcard",
              card: w.chosen,
              text: "Play combat card",
              node: w.node,
              combat: true,
            });
          }
          return cont("no card to play");
        }
        break;
      case "FA.drawT":
      case "EV.drawPrefT":
        return drawStep(S, n, key);
    }
    setPrompt(S, {
      type: "step",
      text: txt,
      items: x.items,
      node: w.node,
      move: txt.startsWith("Move"),
    });
  }

  // ----- priority lists -----
  function handlePriority(S, n) {
    const w = S.walk,
      key = w.page + "." + w.node,
      x = extra(n),
      cards = S.settings.cards,
      txt = text(n);
    const cont = (why) => {
      trail(S, { kind: "pri", text: txt, items: x.items, auto: true, why });
      follow(S, null);
    };
    if (cards) {
      const cardPri = [
        "EV.prefPri",
        "EV.anyPri",
        "FA.playPri",
        "BA.sortiePri",
        "BA.wkPri",
        "BA.atkPri",
        "BA.defPri",
      ];
      if (cardPri.includes(key)) {
        if (key === "BA.wkPri" || key === "BA.atkPri" || key === "BA.defPri") {
          // every card Queller could use as a combat card, plus Call to Battle cards
          const r = evalPlayable(S, Q.combatCandidates(S), "combat");
          if (r === PENDING) return;
          w.cands = r;
          if (S.settings.wome) {
            const b = evalPlayable(S, Q.ctbCards(S), "combat");
            if (b === PENDING) return;
            w.ctb = b;
          } else w.ctb = [];
        }
        let cands = (w.cands || []).slice();
        if (key === "BA.atkPri") cands = cands.concat(w.ctb || []);
        if (!cands.length) {
          w.chosen = null;
          return cont("no candidate card");
        }
        const r = Q.applyPriority(S, cands, x.items);
        w.chosen = r.chosen;
        w.steps = r.steps;
        trail(S, {
          kind: "pri",
          text: txt,
          items: x.items,
          steps: r.steps,
          card: r.chosen,
          auto: true,
        });
        follow(S, null);
        return;
      }
      if (key === "EV.discPri" || key === "FA.discPri") {
        const ds = [];
        if (key === "EV.discPri") {
          ds.push(...Q.autoDiscard(S, x.items, "E"));
          if (S.settings.wome)
            ds.push(...Q.autoDiscard(S, extra(F.FA.nodes.discPri).items, "F"));
        } else ds.push(...Q.autoDiscard(S, x.items, "F"));
        w.discards = ds;
        trail(S, {
          kind: "pri",
          text: txt,
          items: x.items,
          steps: ds.length
            ? ds.map((i) => "Discarded “" + byId[i].title + "”")
            : ["Nothing to discard"],
          auto: true,
        });
        follow(S, null);
        return;
      }
      if (key === "FA.recruitPri") {
        const B = S.board.factions;
        const counts = {};
        for (const id of S.cards.factionHand.concat(S.cards.factionTable)) {
          const c = byId[id];
          if (!c.faction) continue;
          const k = c.faction;
          counts[k] = counts[k] || { p: 0, n: 0 };
          counts[k].n++;
          if (Q.cardFlags(c, S).preferred) counts[k].p++;
        }
        const facs = ["Corsairs", "Dunlendings", "Spiders"].filter(
          (f) => !B[f.toLowerCase()],
        );
        let best = facs.slice(),
          steps = [];
        if (best.length > 1) {
          const m = Math.max(...best.map((f) => (counts[f] || { p: 0 }).p));
          best = best.filter((f) => (counts[f] || { p: 0 }).p === m);
          steps.push(
            "most *preferred* Faction Event cards → " + best.join(", "),
          );
        }
        if (best.length > 1) {
          const m = Math.max(...best.map((f) => (counts[f] || { n: 0 }).n));
          best = best.filter((f) => (counts[f] || { n: 0 }).n === m);
          steps.push("most Faction Event cards → " + best.join(", "));
        }
        if (best.length > 1) {
          best = [Q.pick(best)];
          steps.push("tie — chosen at random (rule 3)");
        }
        w.factionChoice = best[0] || null;
        if (!best.length) steps.push("all factions already in play");
        trail(S, {
          kind: "pri",
          text: txt,
          items: x.items,
          steps,
          choice: w.factionChoice || "none",
          auto: true,
        });
        follow(S, null);
        return;
      }
    }
    if (key === "FA.recruitPri" && S.settings.tracker) {
      // without cards the tracker still knows which factions are left; the player picks among them
      const facs = ["Corsairs", "Dunlendings", "Spiders"].filter(
        (f) => !S.board.factions[f.toLowerCase()],
      );
      if (facs.length <= 1) {
        w.factionChoice = facs[0] || null;
        trail(S, {
          kind: "pri",
          text: txt,
          items: x.items,
          steps: [
            facs.length
              ? "Only the " + facs[0] + " are not yet in play"
              : "all factions already in play",
          ],
          choice: w.factionChoice || "none",
          auto: true,
        });
        follow(S, null);
        return;
      }
      return setPrompt(S, {
        type: "choice",
        text: "Recruit priority: which faction has the most Faction Event cards in Queller’s hand and in play (preferred cards first)?",
        items: x.items,
        options: facs.map((f) => ({ v: f, l: f })),
        set: "factionChoice",
        node: w.node,
        page: w.page,
        pri: txt,
      });
    }
    if (key === "MU.nationPri") {
      const N = S.board.nations,
        allFac = Q.allShadowFactionsInPlay(S);
      if (!S.settings.tracker) {
        const fk = S.settings.cards && S.settings.wome;
        const o = [{ v: "Isengard", l: "Isengard (not yet At War)" }];
        if (S.settings.wome && !(fk && allFac))
          o.push({
            v: "Faction",
            l: "Faction (a Shadow faction can still be recruited)",
          });
        o.push(
          { v: "Sauron", l: "Sauron (not yet At War)" },
          {
            v: "Southrons and Easterlings",
            l: "Southrons and Easterlings (not yet At War)",
          },
          { v: "", l: "None of these" },
        );
        return setPrompt(S, {
          type: "choice",
          text: "Political Track priority: which is the first of these that applies?",
          items: x.items,
          options: o,
          set: "nationChoice",
          node: w.node,
          page: w.page,
          pri: txt,
        });
      }
      const opts = [];
      if (!Q.snAtWar(S, "isengard")) opts.push("Isengard");
      if (S.settings.wome && !allFac) opts.push("Faction");
      if (!Q.snAtWar(S, "sauron")) opts.push("Sauron");
      if (!Q.snAtWar(S, "se")) opts.push("Southrons and Easterlings");
      w.nationChoice = opts[0] || null;
      const pos = ["sauron", "isengard", "se"]
        .map((k) => SN_NAME[k] + ": " + Q.snLabel(N[k] | 0))
        .join(", ");
      trail(S, {
        kind: "pri",
        text: txt,
        items: x.items,
        steps: [
          "Political Track — " + pos,
          opts.length
            ? "Eligible: " + opts.join(", ")
            : "Every Shadow nation is at war",
        ],
        choice: w.nationChoice || "none",
        auto: true,
      });
      follow(S, null);
      return;
    }
    if (key === "MU.minionPri") {
      const c = S.board.chars;
      if (!S.settings.tracker) {
        const mk = S.settings.dice;
        const o = [];
        if (!(mk && c.saruman))
          o.push({ v: "Saruman", l: "Saruman (Isengard At War)" });
        if (!(mk && c.witchKing))
          o.push({
            v: "Witch King",
            l: "Witch King (Sauron At War and a Free Peoples nation At War)",
          });
        if (!(mk && c.mouth))
          o.push({
            v: "Mouth of Sauron",
            l: "Mouth of Sauron (all Shadow nations At War)",
          });
        o.push({ v: "", l: "None can be mustered" });
        return setPrompt(S, {
          type: "choice",
          text: "Minion priority: which is the first of these that can be mustered (not already in play)?",
          items: x.items,
          options: o,
          set: "minionPick",
          node: w.node,
          page: w.page,
          pri: txt,
        });
      }
      const m = Q.minionsAvailable(S);
      w.minionPick = m.length ? m[0].name : null;
      trail(S, {
        kind: "pri",
        text: txt,
        items: x.items,
        steps: m.length
          ? ["Eligible: " + m.map((z) => z.name).join(", ")]
          : ["No minion can be mustered"],
        choice: w.minionPick || "none",
        auto: true,
      });
      follow(S, null);
      return;
    }
    setPrompt(S, { type: "priority", text: txt, items: x.items, node: w.node });
  }

  // ----- answers from the UI -----
  function answer(S, v) {
    const w = S.walk;
    if (!w?.prompt) return;
    const p = w.prompt;
    w.prompt = null;
    const n = cur(S);
    switch (p.type) {
      case "yesno": {
        if (p.part) {
          w.parts[p.part] = !!v;
          trail(S, { kind: "q", text: p.text, answer: v ? "Yes" : "No" });
          break;
        }
        if (p.sub === 1) {
          // bold part of a two-part decision
          if (v) {
            decided(S, p.text, true, true, false);
          } else {
            trail(S, { kind: "q", text: p.text, answer: "No" });
            w.sub = 2;
          }
          break;
        }
        if (p.sub === 2) {
          decided(S, p.text, false, v, false);
          break;
        }
        decided(S, text(n), extra(n).bold, v, false);
        break;
      }
      case "count": {
        const c = Math.max(p.min, Math.min(p.max, Number.parseInt(v, 10) || 0));
        w.parts[p.part] = c;
        trail(S, { kind: "q", text: p.text, answer: String(c) });
        break;
      }
      case "choice": {
        w[p.set] = v || null;
        trail(S, {
          kind: "pri",
          text: p.pri,
          items: p.items,
          steps: ["You chose: " + (v || "none")],
          choice: v || "none",
        });
        follow(S, null);
        break;
      }
      case "situ":
        S.situ[p.key] = !!v;
        trail(S, {
          kind: "q",
          text: p.text,
          answer: v ? "Yes" : "No",
          situ: true,
        });
        break;
      case "confirm":
        S.playable[(p.ctx === "combat" ? "B:" : "") + p.card] = !!v;
        trail(S, {
          kind: "reveal",
          text: byId[p.card].title,
          answer: v ? "playable" : "not playable",
          card: p.card,
        });
        break;
      case "diecheck":
        w.dieAns[p.req] = !!v;
        w.pendingDie = p.label;
        trail(S, { kind: "q", text: p.text, answer: v ? "Yes" : "No" });
        break;
      case "ring":
        if (v) {
          S.board.rings = Math.max(0, S.board.rings - 1);
          S.ringUsedThisTurn = true;
          w.dieAns[p.req] = true;
          w.pendingDie = p.label;
          Q.log(
            S,
            "Elven Ring used to create " + aDie(p.req) + " die (rule 36).",
          );
          trail(S, {
            kind: "ring",
            text: "Elven Ring used for " + aDie(p.req) + " die",
          });
        } else {
          w.dieAns[p.req] = false;
          w.pendingDie = p.label;
        }
        break;
      case "action": {
        if (v === "done") {
          trail(S, { kind: "act", text: p.text, answer: "done" });
          if (p.pass) {
            endWalk(S, "pass", "Queller passes.");
            Q.log(S, "Queller passes.");
            break;
          }
          if (p.minion) {
            S.board.chars[p.minion] = true;
            S.playable = {};
            Q.log(S, w.minionPick + " is now in play (tracker updated).");
          }
          if (p.nation) {
            const now = S.board.nations[p.nation] | 0;
            S.board.nations[p.nation] = Math.max(0, now - 1);
            S.playable = {};
            Q.log(
              S,
              SN_NAME[p.nation] +
                " is now " +
                Q.snLabel(S.board.nations[p.nation]) +
                ".",
            );
          }
          if (p.faction) {
            S.board.factions[p.faction] = true;
            S.playable = {};
            Q.log(
              S,
              w.factionChoice +
                " are now in play (tracker updated; the Faction die joins the pool next turn).",
            );
          }
          if (w.die) spendCurrentDie(S, "“" + p.text + "”");
          else Q.log(S, "Queller: " + p.text);
          endWalk(S, "action", p.text);
          break;
        }
        trail(S, { kind: "act", text: p.text, answer: "not possible" });
        exitAction(S);
        break;
      }
      case "playcard": {
        const palantirBefore = S.cards.table.includes(Q.PALANTIR),
          die = w.die;
        const c = Q.playCard(S, p.card, { combat: p.combat });
        trail(S, {
          kind: "act",
          text: "Played “" + c.title + "”",
          answer: "done",
          card: p.card,
        });
        if (!p.combat && w.die) spendCurrentDie(S, "played “" + c.title + "”"); // spent first so a card effect on the dice never touches the die that played it
        for (const e of Q.resolveCardEffects(S, p.card, {
          combat: p.combat,
          die,
          palantirBefore,
        }))
          trail(S, e);
        if (p.combat) {
          follow(S, null);
          break;
        }
        endWalk(S, "action", "Queller plays “" + c.title + "”.");
        break;
      }
      case "step": {
        trail(S, {
          kind: "step",
          text: p.text,
          answer: v === "no" ? "not possible" : "done",
        });
        if (p.move && v !== "no") w.dieUsed = true;
        follow(S, null);
        break;
      }
      case "roll": {
        trail(S, { kind: "step", text: p.text, answer: v });
        follow(S, v);
        break;
      }
      case "priority": {
        trail(S, {
          kind: "pri",
          text: p.text,
          items: p.items,
          steps: p.steps,
          card: p.card,
          choice: p.choice,
        });
        follow(S, null);
        break;
      }
      case "battleForm": {
        S.battle = v;
        S.playable = Object.fromEntries(
          Object.entries(S.playable).filter(([k]) => !k.startsWith("B:")),
        );
        trail(S, { kind: "note", text: "Battle details recorded" });
        break;
      }
    }
    run(S);
  }

  // ----- phase driver helpers -----
  function phasePage(S) {
    return S.strategy === "military" ? "M14" : "C14";
  }
  function p5Page(S) {
    return S.strategy === "military" ? "M5" : "C5";
  }
  function startPhase(S, phase) {
    const P = phasePage(S);
    if (phase === "setup") {
      S.walk = null;
      startWalk(S, "C14", "Start of game");
      return;
    }
    if (phase === "p1") {
      S.phase = "p1";
      startWalk(S, P, "Phase 1");
      return;
    }
    if (phase === "p2") {
      S.phase = "p2";
      if (S.strategy === "corruption") startWalk(S, "C14", "Phase 2");
      return;
    }
    if (phase === "p3") {
      S.phase = "p3";
      startWalk(S, P, "Phase 3");
      return;
    }
    if (phase === "p4") {
      S.phase = "p4";
      startWalk(S, P, "Phase 4");
      return;
    }
    if (phase === "p5") {
      S.phase = "p5";
      startWalk(S, p5Page(S), "Phase 5");
    }
  }
  function startBattle(S, round) {
    S.walk = null;
    startWalk(S, "BA", round === 1 ? "Battle" : "Battle (next round)", {
      battleRound: round,
      noRun: true,
    });
    if (S.settings.cards) {
      S.walk.prompt = {
        type: "battleForm",
        round,
        text: "Battle details (used to judge which combat cards Queller can play)",
      };
    } else run(S);
  }
  function nextTurn(S) {
    S.turn++;
    S.phase = "p1";
    S.walk = null;
    S.situ = {};
    S.playable = {};
    S.battle = null;
    S.battleOpen = false;
    S.ringUsedThisTurn = false;
    Q.log(S, "— Turn " + S.turn + " —");
  }

  Object.assign(window.QB, {
    startWalk,
    answer,
    run,
    startPhase,
    startBattle,
    nextTurn,
    jumpSpec,
    norm,
    DIE_NAME,
    findStart,
    p5Page,
    phasePage,
  });
})();

// ===== Debug log: action history, error capture and the exportable report =====
// Everything here lives outside the game state (S), so it is never saved, undone or shown to the player during play.
// The action history and errors are kept in localStorage (qb.debug) so a log can still be exported after a reload — including the
// reload that failed to render a saved game.
(function () {
  const Q = window.QB,
    F = Q.F;
  const FORMAT = "queller-debug/1";
  const LIMITS = { actions: 300, errors: 30, walks: 8, states: 5 };
  const D = {
    actions: [],
    errors: [],
    walks: [],
    inflight: null,
    preWalk: null,
    storage: null,
  };

  function push(arr, e, lim) {
    arr.push(e);
    while (arr.length > lim) arr.shift();
  }
  function store() {
    if (!D.storage) return;
    try {
      D.storage.set(
        JSON.stringify({
          actions: D.actions,
          errors: D.errors,
          walks: D.walks,
        }),
      );
    } catch (e) {}
  }
  // storage: {get():string|null, set(string)} — localStorage in the app, anything in tests
  function restore(storage) {
    D.storage = storage || null;
    if (!storage) return;
    try {
      const o = JSON.parse(storage.get() || "null");
      if (o) {
        D.actions = (o.actions || []).slice(-LIMITS.actions);
        D.errors = (o.errors || []).slice(-LIMITS.errors);
        D.walks = (o.walks || []).slice(-LIMITS.walks);
      }
    } catch (e) {
      // Storage unavailable or the saved log is corrupt: start with an empty log.
    }
  }

  // A one-line picture of the game after an action: enough to follow the timeline without opening the full state.
  function digest(S) {
    if (!S) return null;
    const w = S.walk,
      pool = S.dice.pool || [];
    return {
      turn: S.turn,
      phase: S.phase,
      strategy: S.strategy,
      walk: w ? w.page + "." + w.node : null,
      prompt: w?.prompt ? w.prompt.type : null,
      done: w ? !!w.done : null,
      result: w ? w.result : null,
      trail: w ? w.trail.length : 0,
      dice: pool.length
        ? pool
            .map(
              (d) =>
                (d.k === "F" ? "F:" : "") +
                (d.face || "-").replace("/", "+") +
                "/" +
                d.st[0],
            )
            .join(" ")
        : null,
      hunt: S.dice.hunt,
      hand: S.cards.hand.length,
      faction: S.cards.factionHand.length,
      table: S.cards.table.length,
      rings: S.board.rings,
      log: S.log.length,
    };
  }
  function safeDigest(S) {
    try {
      return digest(S);
    } catch (e) {
      return { digestFailed: String(e?.message || e) };
    }
  }
  function walkKey(S, w) {
    return (
      S.turn +
      "|" +
      w.entry.page +
      "|" +
      w.entry.start +
      "|" +
      w.trail.length +
      "|" +
      (w.result || "")
    );
  }
  function compactWalk(S, w, note) {
    return {
      t: Date.now(),
      turn: S.turn,
      entry: w.entry,
      page: w.page,
      node: w.node,
      result: w.result,
      note: note || null,
      die: w.die,
      mode: w.mode,
      trail: w.trail.map((e) => {
        const o = { kind: e.kind, text: e.text, page: e.page, node: e.node };
        if (e.answer != null) o.answer = e.answer;
        if (e.auto) o.auto = true;
        if (e.why) o.why = e.why;
        if (e.card) o.card = e.card;
        if (e.choice) o.choice = e.choice;
        if (e.steps) o.steps = e.steps;
        return o;
      }),
    };
  }
  // Walks are recorded once they finish (or are abandoned), so the trail of a walk the player has moved on from is still in the log.
  function noteWalk(S, w, note) {
    const key = walkKey(S, w);
    const last = D.walks.at(-1);
    if (last?.key === key) return;
    const c = compactWalk(S, w, note);
    c.key = key;
    push(D.walks, c, LIMITS.walks);
  }

  // begin/end bracket a state-changing action (ui.js act()); action() records something that changed no game state.
  function begin(info, S) {
    D.inflight = { t: Date.now(), ...(info || { a: "act" }) };
    D.preWalk = S ? S.walk : null;
    if (S) D.inflight.before = safeDigest(S);
  }
  function end(S) {
    const e = D.inflight || { t: Date.now(), a: "act" };
    D.inflight = null;
    if (S) {
      e.after = safeDigest(S);
      const w = S.walk;
      if (
        D.preWalk &&
        D.preWalk !== w &&
        !D.preWalk.done &&
        e.a !== "undo" &&
        e.a !== "load"
      )
        noteWalk(S, D.preWalk, "replaced or abandoned");
      if (w?.done) noteWalk(S, w);
    }
    D.preWalk = null;
    push(D.actions, e, LIMITS.actions);
    store();
    return e;
  }
  function action(info, S) {
    begin(info, S);
    return end(S);
  }
  function error(err, info, S) {
    const e = { t: Date.now(), ...info };
    if (err && typeof err === "object") {
      e.message = String(err.message || err);
      e.name = err.name;
      if (err.stack)
        e.stack = String(err.stack).split("\n").slice(0, 12).join("\n");
    } else e.message = String(err);
    if (D.inflight && !e.during) e.during = D.inflight;
    else if (!e.during && D.actions.length) e.lastAction = D.actions.at(-1);
    if (S) e.state = safeDigest(S);
    push(D.errors, e, LIMITS.errors);
    D.inflight = null;
    store();
    return e;
  }

  const iso = (t) => {
    try {
      return new Date(t).toISOString();
    } catch (e) {
      return String(t);
    }
  };
  const withTimes = (list) => list.map((e) => ({ when: iso(e.t), ...e }));
  function summary(S, env, errors) {
    const s = [];
    s.push(
      "Queller Bot Runner version " +
        Q.VERSION +
        (env?.built ? " (built " + env.built + ")" : ""),
    );
    if (!S) s.push("No game in progress (New game screen)");
    else {
      s.push(
        "Turn " +
          S.turn +
          ", " +
          S.phase +
          (S.strategy ? ", " + S.strategy + " strategy" : "") +
          "; settings: dice " +
          (S.settings.dice ? "on" : "off") +
          ", cards " +
          (S.settings.cards ? "on" : "off") +
          ", tracker " +
          (S.settings.tracker ? "on" : "off") +
          ", WoME " +
          (S.settings.wome ? "on" : "off"),
      );
      const w = S.walk;
      if (w)
        s.push(
          "Walk: " +
            (F[w.entry.page] ? F[w.entry.page].name : w.entry.page) +
            " from “" +
            Q.norm(w.entry.start) +
            "”, now at " +
            w.page +
            "." +
            w.node +
            (w.prompt ? ", prompt " + w.prompt.type : "") +
            (w.done ? ", finished (" + w.result + ")" : "") +
            ", " +
            w.trail.length +
            " trail entries",
        );
      else s.push("No walk in progress");
    }
    if (errors.length)
      s.push(
        errors.length +
          " error" +
          (errors.length === 1 ? "" : "s") +
          " recorded; latest: " +
          errors[errors.length - 1].message,
      );
    else s.push("No errors recorded");
    s.push(D.actions.length + " actions in the history");
    return s;
  }
  // Build the log. ctx: {S, history (undo snapshots, JSON strings), report, env, dom, storage, brokenAutosave, opts}
  function build(ctx) {
    ctx = ctx || {};
    const S = ctx.S || null;
    const prev = (ctx.history || [])
      .slice(-LIMITS.states)
      .reverse()
      .map((j) => {
        try {
          return JSON.parse(j);
        } catch (e) {
          return { unparseable: String(e) };
        }
      });
    let broken = null;
    if (ctx.brokenAutosave) {
      try {
        broken = JSON.parse(ctx.brokenAutosave);
      } catch (e) {
        broken = {
          unparseable: String(e),
          head: String(ctx.brokenAutosave).slice(0, 400),
        };
      }
    }
    const errors = withTimes(D.errors);
    return {
      format: FORMAT,
      app: { version: Q.VERSION, built: ctx.env?.built || null },
      exported: iso(Date.now()),
      report: ctx.report || "",
      summary: summary(S, ctx.env, errors),
      environment: ctx.env || null,
      dom: ctx.dom || null,
      storage: ctx.storage || null,
      options: ctx.opts || null,
      errors,
      actions: withTimes(D.actions),
      walks: withTimes(D.walks).map((w) => {
        const o = { ...w };
        delete o.key;
        return o;
      }),
      state: S,
      previousStates: prev,
      undoDepth: (ctx.history || []).length,
      brokenAutosave: broken,
      data: {
        pages: Object.keys(F).length,
        nodes: Object.keys(F).reduce(
          (n, k) => n + Object.keys(F[k].nodes).length,
          0,
        ),
        edges: Object.keys(F).reduce((n, k) => n + F[k].edges.length, 0),
        cards: Q.CARDS.length,
      },
    };
  }
  function text(ctx) {
    return JSON.stringify(build(ctx), null, 1);
  }
  function fileName(S) {
    return (
      "queller-debug" +
      (S ? "-turn" + S.turn : "") +
      "-" +
      iso(Date.now()).replace(/[:.]/g, "-").slice(0, 19) +
      ".json"
    );
  }
  function reset() {
    D.actions = [];
    D.errors = [];
    D.walks = [];
    D.inflight = null;
    store();
  }

  window.QB_DEBUG = {
    FORMAT,
    LIMITS,
    restore,
    begin,
    end,
    action,
    error,
    digest,
    build,
    text,
    fileName,
    reset,
    get errors() {
      return D.errors;
    },
    get actions() {
      return D.actions;
    },
    get walks() {
      return D.walks;
    },
  };
})();

// ===== UI =====
(function () {
  const Q = window.QB,
    F = Q.F,
    byId = Q.byId,
    G = window.QB_GLOSSARY,
    DBG = window.QB_DEBUG;
  let S = null,
    history = [],
    modal = null,
    shownCard = null;
  const $ = (s) => document.querySelector(s);
  const esc = (s) =>
    String(s).replace(
      /[&<>"]/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
    );
  function termKey(t) {
    t = t.toLowerCase().replace(/\s+/g, " ").trim();
    if (G[t]) return t;
    if (window.QB_GLOSSARY_ALIASES[t]) return window.QB_GLOSSARY_ALIASES[t];
    const s = t.replace(/s$/, "");
    if (G[s]) return s;
    return null;
  }
  function fmt(t) {
    if (t == null) return "";
    return esc(t)
      .replace(/\*([^*]+)\*/g, (m, w) => {
        const k = termKey(w);
        return k
          ? '<button type="button" class="term" data-term="' +
              k +
              '" aria-describedby="tip">' +
              w +
              "</button>"
          : "<i>" + w + "</i>";
      })
      .replaceAll("\n", "<br>");
  }
  function plain(t) {
    return String(t || "").replaceAll("*", "");
  }

  // ---------- persistence ----------
  const LS = "qb.autosave",
    LSLOTS = "qb.slots",
    LSOPTS = "qb.opts",
    LSDEBUG = "qb.debug";
  function lsGet(k) {
    try {
      return localStorage.getItem(k);
    } catch (e) {
      return null;
    }
  }
  function lsSet(k, v) {
    try {
      localStorage.setItem(k, v);
    } catch (e) {}
  }
  function snapshot() {
    history.push(JSON.stringify(S));
    if (history.length > 60) history.shift();
  }
  function commit() {
    if (S) S.appVersion = Q.VERSION;
    lsSet(LS, JSON.stringify(S));
    render();
  }
  // Every change to the game goes through here. `info` names the action for the debug log ({a:"answer", ...}).
  // If the action throws, the game is put back as it was before it, the error is recorded and the error bar offers a debug log.
  function act(fn, info) {
    snapshot();
    DBG.begin(info || { a: "act" }, S);
    try {
      fn();
    } catch (e) {
      const bad = S;
      S = JSON.parse(history.pop());
      DBG.error(e, { a: "actionFailed", rolledBack: true }, bad);
      commit();
      showErrBar();
      return;
    }
    DBG.end(S);
    commit();
  }
  function undo() {
    if (!history.length) return;
    DBG.begin({ a: "undo" }, S);
    S = JSON.parse(history.pop());
    DBG.end(S);
    commit();
  }
  function loadJSON(txt) {
    const o = JSON.parse(txt);
    if (!o?.settings || !o.board) throw new Error("not a Queller save");
    return Q.migrate(o);
  }

  // ---------- boot ----------
  function boot() {
    DBG.restore({ get: () => lsGet(LSDEBUG), set: (v) => lsSet(LSDEBUG, v) });
    window.addEventListener("error", (e) => {
      DBG.error(
        e.error || e.message,
        {
          a: "uncaught",
          src: e.filename ? String(e.filename).split("/").pop() : null,
          line: e.lineno,
          col: e.colno,
        },
        S,
      );
      showErrBar();
    });
    window.addEventListener("unhandledrejection", (e) => {
      DBG.error(
        e.reason || "unhandled promise rejection",
        { a: "unhandledrejection" },
        S,
      );
      showErrBar();
    });
    const a = lsGet(LS);
    let loadErr = null;
    if (a) {
      try {
        S = loadJSON(a);
      } catch (e) {
        S = null;
        loadErr = e;
      }
    }
    if (loadErr) {
      lsSet(LS + ".broken", a);
      DBG.error(loadErr, {
        a: "boot-load",
        note: "the autosave could not be parsed; kept under " + LS + ".broken",
      });
    }
    DBG.action(
      {
        a: "pageLoad",
        autosave: !!a,
        restored: !!S,
        broken: !!lsGet(LS + ".broken"),
      },
      S,
    );
    document.documentElement.lang = document.documentElement.lang || "en";
    tipEl = document.createElement("div");
    tipEl.id = "tip";
    tipEl.hidden = true;
    tipEl.setAttribute("role", "tooltip");
    tipEl.addEventListener("mouseleave", hideTip);
    document.body.appendChild(tipEl);
    document.body.addEventListener("mouseover", (e) => {
      const t = e.target.closest(".term");
      if (t) showTip(t);
    });
    document.body.addEventListener("mouseout", (e) => {
      const t = e.target.closest(".term");
      if (t && !e.relatedTarget?.closest?.("#tip")) hideTip();
    });
    document.body.addEventListener("focusin", (e) => {
      const t = e.target.closest(".term");
      if (t) showTip(t);
    });
    document.body.addEventListener("focusout", (e) => {
      if (e.target.closest(".term")) hideTip();
    });
    document.body.addEventListener("click", (e) => {
      const t = e.target.closest(".term");
      if (t) {
        hideTip();
        openModal("glossary", t.dataset.term);
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (tipEl && !tipEl.hidden) {
          hideTip();
          e.stopPropagation();
          return;
        }
        if (modal) closeModal();
      }
    });
    try {
      render();
    } catch (e) {
      console.error(
        "Queller Runner: could not render the saved game — starting at the New game screen.",
        e,
      );
      lsSet(LS + ".broken", lsGet(LS) || "");
      DBG.error(
        e,
        {
          a: "boot-render",
          note:
            "the saved game could not be rendered; kept under " +
            LS +
            ".broken",
        },
        S,
      );
      S = null;
      history = [];
      render();
      showErrBar();
    }
  }
  // A bar above the app after an error: the game carries on (a failed action was rolled back) and a debug log is one tap away.
  function showErrBar() {
    let bar = document.getElementById("errbar");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "errbar";
      bar.setAttribute("role", "alert");
      document.body.prepend(bar);
    }
    const n = DBG.errors.length,
      last = DBG.errors[n - 1];
    bar.innerHTML =
      '<div class="wrap"><span class="msg"><b>Something went wrong in the app</b> — ' +
      esc(last ? last.message : "an error was recorded") +
      (last?.rolledBack
        ? ". Your last action was undone; the game continues."
        : ".") +
      " Please export a debug log and send it with a description of what you were doing.</span>" +
      '<span class="eb"><button type="button" class="btn small" id="errbarLog">Export debug log</button><button type="button" class="btn small ghost" id="errbarClose" aria-label="Dismiss this message">Dismiss</button></span></div>';
    document.getElementById("errbarLog").onclick = () => openModal("debug");
    document.getElementById("errbarClose").onclick = () => bar.remove();
  }
  let tipEl = null;
  function showTip(t) {

    tipEl.innerHTML =
      "<b>" + esc(k) + "</b>" + esc(G[k]).replace(/\*([^*]+)\*/g, "<i>$1</i>");
    const r = t.getBoundingClientRect();
    const w = Math.min(360, window.innerWidth - 24);
    tipEl.style.maxWidth = w + "px";
    let x = Math.min(r.left, window.innerWidth - w - 12),
      y = r.bottom + 8;
    tipEl.style.left = Math.max(8, x) + "px";
    tipEl.style.top = y + "px";
    tipEl.hidden = false;
    const h = tipEl.offsetHeight;
    if (y + h > window.innerHeight - 8)
      tipEl.style.top = Math.max(8, r.top - h - 8) + "px";

      "data-ans",
      "data-card",
      "data-t",
      "data-step",
      "data-modal",
      "data-t-reset",

          "[" +

          '="' +
          el.getAttribute(a) +
          '"]' +
          (el.dataset.d === undefined
            ? ""
            : '[data-d="' + el.dataset.d + '"]') +
          (el.dataset.id === undefined

    }

  }

      (d) => d.open,

      root.innerHTML = setupHTML();

      () => {

      { a: "tracker", key: k, from, to: v },

      const a = asks.shift();
      if (!a) return;
      ask({
        title: "Discard “" + byId[a.card].title + "”?",

        buttons: [
