<title>Queller Bot Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #e9e5dc;
  --surface: #f6f3ec;
  --surface2: #ede8de;
  --ink: #221e1b;
  --muted: #4e4842;
  --line: #cfc7b9;
  --line2: #8f8574;
  --accent: #7e2419;
  --accent-ink: #fff7f2;
  --gold: #8e6f22;
  --focus: #3b6ea8;
  --ok: #2a5731;
  --warn: #6e4508;
  --bad: #8a2820;
  --nS: #d5e8d4;
  --nSs: #82b366;
  --nA: #f8cecc;
  --nAs: #b85450;
  --nD: #fff2cc;
  --nDs: #d6b656;
  --nd: #dae8fc;
  --nds: #6c8ebf;
  --nJ: #f2f0ea;
  --nJs: #666;
  --nP: #e1d5e7;
  --nPs: #9673a6;
  --nT: #ffe6cc;
  --nTs: #d79b00;
  --node-ink: #1d1a17;
  --shadow: 0 1px 2px rgb(30 20 10 / 8%), 0 6px 18px -8px rgb(30 20 10 / 25%);
  --font-display: "Cinzel", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17151a;
    --surface: #211e25;
    --surface2: #2a2630;
    --ink: #e9e3d6;
    --muted: #c4bdb0;
    --line: #3d3843;
    --line2: #7a7282;
    --accent: #f0907f;
    --accent-ink: #1a0d0b;
    --gold: #cda24b;
    --focus: #7fa9e0;
    --ok: #7cc484;
    --warn: #e0ac58;
    --bad: #ee8577;
    --nS: #2f4a2e;
    --nSs: #82b366;
    --nA: #5a2b28;
    --nAs: #d0736a;
    --nD: #4d4219;
    --nDs: #d6b656;
    --nd: #26384f;
    --nds: #7fa0d4;
    --nJ: #2d2a31;
    --nJs: #8b8591;
    --nP: #3e2f48;
    --nPs: #b48cd0;
    --nT: #5a3f1c;
    --nTs: #e0a040;
    --node-ink: #efe9dd;
    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 8px 20px -10px rgb(0 0 0 / 60%);
  }
}
:root[data-theme="dark"] {
  --bg: #17151a;
  --surface: #211e25;
  --surface2: #2a2630;
  --ink: #e9e3d6;
  --muted: #c4bdb0;
  --line: #3d3843;
  --line2: #7a7282;
  --accent: #f0907f;
  --accent-ink: #1a0d0b;
  --gold: #cda24b;
  --focus: #7fa9e0;
  --ok: #7cc484;
  --warn: #e0ac58;
  --bad: #ee8577;
  --nS: #2f4a2e;
  --nSs: #82b366;
  --nA: #5a2b28;
  --nAs: #d0736a;
  --nD: #4d4219;
  --nDs: #d6b656;
  --nd: #26384f;
  --nds: #7fa0d4;
  --nJ: #2d2a31;
  --nJs: #8b8591;
  --nP: #3e2f48;
  --nPs: #b48cd0;
  --nT: #5a3f1c;
  --nTs: #e0a040;
  --node-ink: #efe9dd;
  --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 8px 20px -10px rgb(0 0 0 / 60%);
}
* {
  box-sizing: border-box;
}
html {
  font-size: 15px;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.5;
  padding-block: 0 32px;
  padding-inline: 16px;
}
h1,
h2,
h3,
h4 {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: 0.01em;
  margin: 0;
  text-wrap: balance;
}
button {
  font: inherit;
  color: inherit;
}
a {
  color: var(--accent);
}
.wrap {
  max-width: 1280px;
  margin: 0 auto;
}
/* header */
.top {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding-block: 12px;
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.brand h1 {
  font-size: 1.25rem;
}
.brand .sub {
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.status {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 0.85rem;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border: 1px solid var(--line2);
  border-radius: 999px;
  background: var(--surface);
  font-variant-numeric: tabular-nums;
}
.chip b {
  font-weight: 600;
}
.chip.strat-corruption {
  border-color: var(--accent);
}
.chip.strat-military {
  border-color: var(--gold);
}
.tools {
  margin-left: auto;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.btn {
  border: 1px solid var(--line2);
  background: var(--surface);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 0.9rem;
  line-height: 1.2;
}
.btn:hover {
  border-color: var(--ink);
}
*:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  box-shadow: 0 0 0 2px var(--surface);
}
.skip {
  position: absolute;
  left: -9999px;
  top: 8px;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 12px 16px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  border-radius: 6px;
  z-index: 70;
}
.skip:focus {
  left: 16px;
}
input[type="checkbox"] {
  width: 22px;
  height: 22px;
  margin: 3px;
  accent-color: var(--accent);
  flex: 0 0 auto;
}
select {
  min-height: 44px;
}
.answers .btn,
.phasebar .btn:not(.small),
.tools .btn,
.modal header .btn,
#start,
#loadBtn,
#debugBtn,
#jumpGo,
#loadTxtBtn,
#dlBtn,
#copyBtn,
#dbgOpen,
#dbgDl,
#dbgCopy,
#calcClear {
  min-height: 44px;
  min-width: 44px;
}
#newGameBtn {
  border-color: var(--accent);
  color: var(--accent);
}
.askctl {
  min-height: 44px;
  min-width: 180px;
  font: inherit;
  padding: 4px 8px;
  border: 1px solid var(--line2);
  border-radius: 5px;
  background: var(--surface2);
  color: var(--ink);
  margin-top: 4px;
}
.btn.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
  font-weight: 600;
}
.btn.ghost {
  background: transparent;
}
.btn.small {
  padding: 3px 12px;
  font-size: 0.8rem;
  min-height: 44px;
  min-width: 44px;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn.yes {
  border-color: var(--ok);
}
.btn.no {
  border-color: var(--bad);
}
/* layout */
.grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 20px;
  padding-top: 18px;
}
.grid main > section + section {
  margin-top: 14px;
}
@media (width <=900px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
.toprow {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding-top: 18px;
}
.toprow > section:only-child {
  grid-column: 1/-1;
}
@media (width <=900px) {
  .toprow {
    grid-template-columns: 1fr;
  }
}
.toprow + .grid {
  padding-top: 20px;
}
.grid.nowalk {
  grid-template-columns: 1fr;
}
.grid.nowalk .side {
  flex-flow: row wrap;
  align-items: flex-start;
}
.grid.nowalk .side > section {
  flex: 1 1 300px;
  max-width: 520px;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.panel h2.ph {
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel h2.ph .r {
  margin-left: auto;
  font-family: var(--font-body);
  letter-spacing: 0;
  text-transform: none;
  font-weight: 400;
}
.side {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
/* prompt card */
.phasebar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 12px;
}
.phasebar .lbl {
  font-size: 0.8rem;
  color: var(--muted);
  margin-right: 4px;
}
.prompt {
  border-radius: 10px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  position: relative;
  margin-bottom: 12px;
}
.prompt .eyebrow {
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 6px;
}
.prompt .eyebrow .sw {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  border: 1px solid rgb(0 0 0 / 25%);
  display: inline-block;
}
.prompt .q {
  font-size: 1.15rem;
  line-height: 1.5;
  margin: 0 0 12px;
  max-width: 70ch;
}
.prompt.k-D {
  background: var(--nD);
  border-color: var(--nDs);
}
.prompt.k-d {
  background: var(--nd);
  border-color: var(--nds);
}
.prompt.k-A {
  background: var(--nA);
  border-color: var(--nAs);
}
.prompt.k-T {
  background: var(--nT);
  border-color: var(--nTs);
}
.prompt.k-P {
  background: var(--nP);
  border-color: var(--nPs);
}
.prompt.k-J {
  background: var(--nJ);
  border-color: var(--nJs);
}
.prompt.k-S {
  background: var(--nS);
  border-color: var(--nSs);
}
.prompt.k-D,
.prompt.k-d,
.prompt.k-A,
.prompt.k-T,
.prompt.k-P,
.prompt.k-J,
.prompt.k-S {
  color: var(--node-ink);
}
.prompt .bold-note {
  font-size: 0.8rem;
  margin: -6px 0 10px;
  max-width: 75ch;
}
.ring-ico {
  width: 1em;
  height: 1em;
  vertical-align: -0.15em;
  color: var(--accent);
  flex: 0 0 auto;
}
.prompt .q .ring-ico {
  width: 1.1em;
  height: 1.1em;
}
.prompt .help {
  font-size: 0.85rem;
  margin: -4px 0 10px;
  max-width: 75ch;
}
.prompt ol {
  margin: 0 0 12px;
  padding-left: 22px;
}
.prompt ol li {
  margin: 2px 0;
}
.prompt .answers {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.prompt .answers .btn {
  background: rgb(255 255 255 / 55%);
  color: var(--node-ink);
}
:root[data-theme="dark"] .prompt .answers .btn {
  background: rgb(0 0 0 / 25%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .prompt .answers .btn {
    background: rgb(0 0 0 / 25%);
  }
}
.prompt .steps {
  font-size: 0.85rem;
  margin: 0 0 10px;
  padding-left: 18px;
}
.idle {
  padding: 14px;
  border: 1px dashed var(--line2);
  border-radius: 10px;
  color: var(--muted);
}
.result {
  padding: 14px 16px;
  border-radius: 10px;
  border: 1px solid var(--line2);
  background: var(--surface2);
  margin-bottom: 12px;
}
.result .big {
  font-size: 1.15rem;
  font-weight: 600;
}
/* card face */
.card {
  border: 1px solid var(--line2);
  border-radius: 8px;
  padding: 10px 12px;
  background: var(--surface);
  color: var(--ink);
  margin: 6px 0 12px;
  font-size: 0.88rem;
  max-width: 520px;
}
.card .ct {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: baseline;
}
.card .ct b {
  font-family: var(--font-display);
  font-size: 1rem;
}
.card .tag {
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.card .cond {
  font-weight: 600;
  margin: 4px 0;
}
.card p {
  margin: 0;
}
.card p + p {
  margin-top: 1.5em;
}
.card .combat {
  border-top: 1px dashed var(--line2);
  margin-top: 8px;
  padding-top: 6px;
}
.card .combat.only {
  border-top: none;
  margin-top: 4px;
  padding-top: 0;
}
.card .halfnote {
  display: block;
  margin-top: 8px;
  text-align: right;
}
/* trail */
.trail {
  font-size: 0.85rem;
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--line);
  padding-top: 8px;
  max-height: 280px;
  overflow: auto;
}
.trail li {
  display: flex;
  gap: 8px;
  padding: 3px 0;
  align-items: flex-start;
  border-bottom: 1px dotted var(--line);
}
.trail .k {
  flex: 0 0 66px;
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  padding-top: 3px;
}
.trail .a {
  margin-left: auto;
  font-weight: 600;
  white-space: nowrap;
}
.trail .why {
  color: var(--muted);
  font-size: 0.78rem;
}
.trail li.auto .txt {
  color: var(--muted);
}
.trail li.t-skip .a {
  color: var(--warn);
}
.trail li.t-jump .txt,
.trail li.t-ret .txt,
.trail li.t-back .txt {
  font-style: italic;
}
.trail li.t-end {
  border-bottom: none;
  font-weight: 600;
}
details summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 0.85rem;
  margin: 8px 0;
  min-height: 44px;
  display: flex;
  align-items: center;
}
.more {
  margin-top: 12px;
  border-top: 1px dotted var(--line);
  padding-top: 8px;
}
.more .mlbl {
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 6px;
}
/* dice */
.dice {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.dicewrap {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: stretch;
}
.huntbox {
  position: relative;
  border: 2px solid var(--accent);
  border-radius: 10px;
  padding: 14px 8px 8px;
  width: 100%;
  margin-top: 6px;
}
.huntbox .hlbl {
  position: absolute;
  top: -9px;
  left: 8px;
  background: var(--surface);
  padding: 0 5px;
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  white-space: nowrap;
  line-height: 1.2;
}
.die.empty {
  border-style: dashed;
  background: transparent;
}
.dice li {
  display: flex;
}
button.die {
  cursor: pointer;
  color: inherit;
  font: inherit;
}
button.die:hover {
  border-color: var(--ink);
  box-shadow: var(--shadow);
}
.die {
  width: 48px;
  height: 48px;
  border-radius: 8px;
  border: 2px solid var(--line2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  text-align: center;
  line-height: 1.05;
  padding: 2px;
  background: var(--surface2);
  position: relative;
}
.die.f-Eye {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.die .ico {
  width: 30px;
  height: 30px;
  color: var(--ink);
}
.die.f-Eye .ico {
  color: var(--accent-ink);
}
.die .blank {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--line2);
}
.die.st-used .ico {
  opacity: 0.5;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 10px;
  font-size: 0.72rem;
  color: var(--muted);
}
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.legend .ico {
  width: 16px;
  height: 16px;
  color: var(--muted);
}
.die.st-used {
  opacity: 0.45;
}
.die.st-used::after {
  content: "";
  position: absolute;
  left: 6px;
  right: 6px;
  top: 50%;
  height: 2px;
  background: var(--bad);
  transform: rotate(-30deg);
}
.die.st-hunt {
  border-color: var(--accent);
}
.die.st-reserved {
  border-style: dashed;
  border-color: var(--gold);
}
.die.st-pool {
  border-style: dotted;
  color: var(--muted);
}
.die.k-F {
  border-radius: 50%;
}
.die .cap {
  position: absolute;
  bottom: -14px;
  font-size: 0.55rem;
  color: var(--muted);
  letter-spacing: 0.05em;
}
.dicerow {
  display: flex;
  gap: 10px 16px;
  flex-wrap: wrap;
  font-size: 0.85rem;
  margin-top: 8px;
  align-items: center;
}
.kv {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 10px;
  font-size: 0.88rem;
  align-items: center;
}
.kv .v {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
/* tracker */
.tracker {
  display: flex;
  flex-direction: column;
  font-size: 0.88rem;
}
.tracker h3 {
  font-family: var(--font-body);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 14px 0 2px;
  border-bottom: 1px solid var(--line2);
  padding-bottom: 4px;
  font-weight: 600;
}
.tracker h3:first-child {
  margin-top: 0;
}
.tracker .row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 118px;
  column-gap: 12px;
  align-items: center;
  min-height: 44px;
  border-bottom: 1px dotted var(--line);
}
.tracker .row:last-child {
  border-bottom: none;
}
.tracker .row > label,
.tracker .row > span:first-child {
  padding-block: 6px;
  line-height: 1.3;
}
.tracker .row > label {
  cursor: pointer;
  min-height: 44px;
  display: flex;
  align-items: center;
  align-self: stretch;
}
.tracker label.row {
  cursor: pointer;
}
.tracker label.row > span:first-child {
  align-self: stretch;
  display: flex;
  align-items: center;
}
.tracker .row > input[type="checkbox"],
.tracker .row > select,
.tracker .row > .stepper,
.tracker .row > b,
.tracker .row > .btn {
  justify-self: end;
}
.tracker .row > input[type="checkbox"] {
  margin: 0 11px 0 0;
}
.tracker select {
  width: 118px;
  font: inherit;
  padding: 2px 6px;
  border: 1px solid var(--line2);
  border-radius: 5px;
  background: var(--surface2);
  color: var(--ink);
}
.tracker .situ .row > span {
  font-size: 0.82rem;
  color: var(--muted);
}
.stepper {
  display: inline-flex;
  align-items: center;
  gap: 0;
  width: 118px;
  justify-content: space-between;
}
.stepper button {
  width: 44px;
  height: 44px;
  border-radius: 5px;
  border: 1px solid var(--line2);
  background: var(--surface2);
  cursor: pointer;
  padding: 0;
  line-height: 1;
  font-size: 1.1rem;
}
.stepper .n {
  min-width: 26px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
abbr[title] {
  text-decoration: underline dotted;
  cursor: help;

  const handBy = (S, deck) => S.cards.hand.filter((i) => byId[i].deck === deck);
  // Cards Queller may use as a combat card: the hand, plus table cards whose text allows it (Balrog of Moria).
  const combatCandidates = (S) =>
    S.cards.hand.concat(S.cards.table.filter((i) => byId[i].tableCombat));
  const ctbCards = (S) =>
    CARDS.filter(
      (c) => c.deck === "B" && S.board.factions[c.faction.toLowerCase()],
    ).map((c) => c.id);

  // ---------- board helpers ----------
  // Shadow nations on the Political Track: nations.sauron/isengard/se = steps above "At War" (0 = At War, 1-3 = Active +N). Start: Sauron 1, Isengard 1, S&E 2.
  const SN_START = { sauron: 1, isengard: 1, se: 2 };
  function snAtWar(S, k) {
    return (S.board.nations[k] | 0) === 0;
  }
  function snAllAtWar(S) {
    return snAtWar(S, "sauron") && snAtWar(S, "isengard") && snAtWar(S, "se");
  }
  function snLabel(v) {
    return v === 0 ? "At War" : "Active +" + v;
  }
  function fpNationAtWar(S) {
    return ["gondor", "rohan", "north", "dwarves", "elves"].some(
      (k) => S.board.nations[k] === "war",
    );
  }
  function shadowFactionInPlay(S) {
    return S.settings.wome && SHADOW_FACTIONS.some((k) => S.board.factions[k]);
  }
  function allShadowFactionsInPlay(S) {
    return SHADOW_FACTIONS.every((k) => S.board.factions[k]);
  }
  // Whether the app knows how many Elven Rings the Shadow holds: the full tracker has the field, and so does the minimal tracker when dice are rolled.
  function ringsKnown(S) {
    return !!(S.settings.tracker || S.settings.dice);
  }
  function ringAvailable(S) {
    return !S.ringUsedThisTurn && (!ringsKnown(S) || S.board.rings > 0);
  }
  // Hunt box maximum (rulebook: the number of Companions, but always at least one) — rule 34 caps the flowchart allocations at it.
  function huntCap(S) {
    return Math.max(1, S.board.fs.companions | 0);
  }
  // Minions Queller could muster now, in priority order (Muster page); the first is the one it musters.
  function minionsAvailable(S) {
    const c = S.board.chars,
      out = [];
    if (snAtWar(S, "isengard") && !c.saruman)
      out.push({ name: "Saruman", key: "saruman", why: "Isengard at war" });
    if (snAtWar(S, "sauron") && fpNationAtWar(S) && !c.witchKing)
      out.push({
        name: "Witch King",
        key: "witchKing",
        why: "Sauron at war and a Free Peoples nation at war",
      });
    if (snAllAtWar(S) && !c.mouth)
      out.push({
        name: "Mouth of Sauron",
        key: "mouth",
        why: "all Shadow nations at war",
      });

  }
  // Older saves kept the Shadow nations as booleans (true = at war); now they are steps above At War.
  function migrateNations(n) {
    for (const k of ["sauron", "isengard", "se"]) {
      if (typeof n[k] === "boolean") n[k] = n[k] ? 0 : SN_START[k];

    }
  }
  function migrate(o) {
    if (o.settings && o.settings.tracker === undefined) {
      o.settings.tracker = o.settings.walk !== false;
      delete o.settings.walk;
    }
    if (o.board?.nations) migrateNations(o.board.nations);
    if (o.board && o.board.rings === undefined) o.board.rings = 0;
    delete o.shownCard;
    delete o.lastAction;
    return o;
  }

  // ---------- playability preconditions ----------
  // Each returns true/false, or asks a situational question (answered once per turn) via situ().
  const SITU_Q = {
    mtSiege: "Is Minas Tirith under siege by a Shadow army?",
    nazNearFP:
      "Is a Shadow army containing Nazgûl adjacent to, or in the same region as, a Free Peoples army?",
    wkBesieging:
      "Is the Witch-king with a Shadow army that is besieging a Stronghold?",
    isenBesieging:
      "Is an army containing an Isengard unit besieging a Stronghold?",
    elvenStronghold: "Does the Shadow control at least one Elven Stronghold?",
    fpNotWar:
      "Is the Fellowship or a Companion inside the borders of a Free Peoples nation that is not at war?",
    siegeEngine: "Is a Shadow Siege Engine in this battle?",
  };
  function situ(S, key) {
    const v = S.situ[key];
    if (v === undefined) return { situ: key, q: SITU_Q[key] };
    return v;
  }
  const PRECONDITIONS = {
    fsNotInFPSettlement: (S) => !S.board.fs.inFPSettlement,
    fsProgress1: (S) => S.board.fs.progress >= 1,
    fsRevealed: (S) => S.board.fs.revealed,
    saruman: (S) => S.board.chars.saruman,
    witchKing: (S) => S.board.chars.witchKing,
    aragorn: (S) => S.board.chars.aragorn,
    isengardAtWar: (S) => snAtWar(S, "isengard"),
    sauronAtWar: (S) => snAtWar(S, "sauron"),
    seAtWar: (S) => snAtWar(S, "se"),
    allAtWar: snAllAtWar,
    dunlendings: (S) => S.board.factions.dunlendings,
    corsairs: (S) => S.board.factions.corsairs,
    fpFaction: (S) => {
      const f = S.board.factions;
      return f.ents || f.eagles || f.deadmen;
    },
    mtSiege: (S) => situ(S, "mtSiege"),
    nazNearFP: (S) => situ(S, "nazNearFP"),
    elvenStronghold: (S) => situ(S, "elvenStronghold"),
    fpNotWar: (S) => situ(S, "fpNotWar"),
    wkBesieging: (S) =>
      S.board.chars.witchKing ? situ(S, "wkBesieging") : false,
    isenBesieging: (S) =>
      S.board.chars.saruman ? situ(S, "isenBesieging") : false,
    // The Lidless Eye has no effect without an unused die (rule 17); only checkable when the app rolls the dice.
    unusedDice: (S) =>
      !S.settings.dice ||
      availDice(S).some(
        (d) =>
          d.k === "A" && !(S.walk && S.dice.pool.indexOf(d) === S.walk.dieObj),
      ),
  };
  function precondition(id, S) {
    const k = byId[id].pre;
    return k ? PRECONDITIONS[k](S) : true;
  }
  // combat-card precondition from the battle form
  const COMBAT_PRECONDITIONS = {
    nazLead1: (S, B) => (B.nazLead | 0) >= 1,
    nazLead2: (S, B) => (B.nazLead | 0) >= 2,
    nazInBattle: (S, B) => (B.nazLead | 0) > 0,
    siegeEngine: (S) => situ(S, "siegeEngine"),
    isengardStronghold: (S, B) => !!B.isengardStronghold,
    seElite: (S, B) => !!B.seElite,
    shadowElite: (S, B) => !!B.shadowElite,
    nearMoria: (S, B) => !!B.nearMoria,
    defInFs: (S, B) => !!B.defInFs,
    ctb: () => true,
    ctbNotBesieged: (S, B) => !B.underSiege,
    ctbAttackingSiege: (S, B) => !!B.attackingSiege,
  };
  function combatPre(c, S) {
    const B = S.battle || {};
    if (c.deck === "B") {
      const fac = c.faction.toLowerCase();
      if (!S.board.factions[fac] || !B.figures?.[fac]) return false;

    return c.cpre ? COMBAT_PRECONDITIONS[c.cpre](S, B) : true;
  }

  // ---------- initial state ----------
  function newState(settings) {
    const S = {
      appVersion: VERSION,
      createdVersion: VERSION, // the version that last saved this game, and the one that created it
      settings: {
        dice: true,
        cards: true,
        tracker: true,
        wome: true,
        ...settings,
      },
      turn: 1,
      strategy: null,
      phase: "setup",
      dice: { pool: [], base: 7, hunt: 0, factionDie: false },
      cards: {
        decks: { C: [], S: [], F: [] },
        discards: { C: [], S: [], F: [] },
        hand: [],
        factionHand: [],
        table: [],
        factionTable: [],
      },
      board: {
        fs: {
          progress: 0,
          revealed: false,
          mordor: false,
          inFPSettlement: true,
          inStrongholdOrSea: true,
          atStart: true,
          guideGollum: false,
          companions: 7,
        },
        chars: {
          saruman: false,
          witchKing: false,
          mouth: false,
          gandalfWhite: false,
          aragorn: false,
        },
        nations: {
          sauron: 1,
          isengard: 1,
          se: 2,
          gondor: "passive",
          rohan: "passive",
          north: "passive",
          dwarves: "passive",
          elves: "active",
        },
        factions: {
          corsairs: false,
          dunlendings: false,
          spiders: false,
          ents: false,
          eagles: false,
          deadmen: false,
        },
        nazgul: 4,
        shadowVP: 0,
        corruption: 0,
        rings: 0,
      },
      ringUsedThisTurn: false,
      situ: {},
      playable: {},
      battle: null,
      battleOpen: false,
      minionReserved: false,
      walk: null,
      log: [],
    };
    buildDecks(S);
    return S;
  }
  // Whether a card goes into this game's decks: Call to Battle cards never do, WoME cards only with the expansion, and the two cards
  // that have a base-game and a WoME version (sa028/sa038 and their b2 twins) contribute whichever version applies.
  function inDecks(c, wome) {
    if (c.deck === "B") return false;
    if (c.set === "WoME" && !wome) return false;
    if (c.id === "sa028b2" || c.id === "sa038b2") return !wome;
    if (c.id === "sa028" || c.id === "sa038") return wome;
    return true;
  }
  function buildDecks(S) {
    const w = S.settings.wome;
    const decks = { C: [], S: [], F: [] };
    for (const c of CARDS)
      if (inDecks(c, w) && decks[c.deck]) decks[c.deck].push(c.id);
    S.cards.decks = {
      C: shuffle(decks.C),
      S: shuffle(decks.S),
      F: shuffle(decks.F),
    };
  }

  // ---------- dice ----------
  const SHADOW_FACES = [
    "Muster",
    "Army/Muster",
    "Army",
    "Character",
    "Event",
    "Eye",
  ];
  const FACTION_FACES = [
    "Recruit",
    "Play/Draw",
    "Recruit/Play",
    "Recruit/Draw",
    "Eye",
    "Wild",
  ];
  function diceCount(S) {
    const c = S.board.chars;
    return 7 + (c.saruman ? 1 : 0) + (c.witchKing ? 1 : 0) + (c.mouth ? 1 : 0);
  }
  function recoverDice(S) {
    const n = diceCount(S);
    S.dice.pool = [];
    S.dice.hunt = 0;
    for (let i = 0; i < n; i++)
      S.dice.pool.push({ k: "A", face: null, st: DIE_STATE.POOL });
    // WoME p.8: the Faction die joins the pool at the start of the turn after the first Shadow Faction enters play, and leaves it the turn after the last one is gone.
    S.dice.factionDie = shadowFactionInPlay(S);
    if (S.dice.factionDie)
      S.dice.pool.push({ k: "F", face: null, st: DIE_STATE.POOL });
    S.minionReserved = false;
    S.ringUsedThisTurn = false;
    S.situ = {};
    S.playable = {};
    log(
      S,
      "Recovered " +
        n +
        " action dice" +
        (S.dice.factionDie ? " and the Faction die" : "") +
        ".",
    );
  }
  function assignHunt(S, n) {
    const pool = S.dice.pool.filter(
      (d) => d.k === "A" && d.st === DIE_STATE.POOL,
    );
    const cap = huntCap(S),
      k = Math.min(n, cap, pool.length);
    for (let i = 0; i < k; i++) {
      pool[i].st = DIE_STATE.HUNT;
      pool[i].face = "Eye";
    }
    S.dice.hunt += k;
    log(
      S,
      "Placed " +
        k +
        " " +
        (k === 1 ? "die" : "dice") +
        " in the Hunt box before rolling" +
        (k < n && cap < n
          ? " (rule 34: maximum " +
            cap +
            " for " +
            (S.board.fs.companions | 0) +
            " Companions)"
          : "") +
        ".",
    );
    return k;
  }
  function rollRemaining(S) {
    let eyes = 0;
    const out = [];
    for (const d of S.dice.pool) {
      if (d.st !== DIE_STATE.POOL) continue;
      d.face = d.k === "A" ? pick(SHADOW_FACES) : pick(FACTION_FACES);
      if (d.face === "Eye") {
        d.st = DIE_STATE.HUNT;
        S.dice.hunt++;
        eyes++;
      } else d.st = DIE_STATE.AVAIL;
      out.push(d.face);
    }
    let hunt = "";
    if (eyes)
      hunt = " — " + eyes + " Eye" + (eyes > 1 ? "s" : "") + " to the Hunt box";
    log(S, "Rolled: " + out.join(", ") + hunt + ".");
    return out;
  }
  function preferredFaces(S) {
    return S.strategy === "corruption"
      ? ["Character"]
      : ["Army", "Muster", "Army/Muster"];
  }
  // which available dice satisfy a requirement
  const REQ = {
    Army: ["Army", "Army/Muster", "Wild"],
    Muster: ["Muster", "Army/Muster", "Wild"],
    Character: ["Character", "Wild"],
    Event: ["Event", "Wild"],
    CharOrMuster: ["Character", "Muster", "Army/Muster", "Wild"],
    FRecruit: ["Recruit", "Recruit/Play", "Recruit/Draw", "Wild"],
    FPlay: ["Play/Draw", "Recruit/Play", "Wild"],
    FDraw: ["Play/Draw", "Recruit/Draw", "Wild"],
  };
  // Does a die already held for `have` satisfy a step that needs `need`?
  function dieSatisfies(have, need) {
    return (
      !!have &&
      (have === need ||
        (need === "CharOrMuster" &&
          (have === "Character" || have === "Muster")))
    );
  }
  function availDice(S) {
    return S.dice.pool.filter((d) => d.st === DIE_STATE.AVAIL);
  }
  function findDie(S, req) {
    const faces = REQ[req] || [req];
    const av = availDice(S);
    for (const f of faces) {
      const d = av.find((x) => x.face === f);
      if (d) return d;
    }
    return null;
  }
  function spendDie(S, die, why) {
    if (!die) return;
    die.st = DIE_STATE.USED;
    log(S, "Used the " + die.face + " die" + (why ? " — " + why : "") + ".");
  }
  // rule 36 / 23 selection: at random from the dice that do not show a preferred result; from all dice if every die does
  function nonPreferredFirst(S, dice, n) {
    const pref = preferredFaces(S);
    let cands = dice.filter((d) => !pref.includes(d.face));
    if (!cands.length) cands = dice.slice();
    const out = [];
    while (out.length < n && cands.length) {
      const i = rnd(cands.length);
      out.push(cands.splice(i, 1)[0]);
    }
    return out;
  }
  function ringChange(S, req) {
    // rule 36: change one non-preferred available die to the required result
    const av = availDice(S).filter((d) => d.k === "A");
    if (!av.length) return null;
    const d = nonPreferredFirst(S, av, 1)[0];
    const from = d.face;
    let face = req;
    if (req === "CharOrMuster") face = "Character";
    else if (req.startsWith("F")) face = "Wild";
    d.face = face;
    S.board.rings = Math.max(0, S.board.rings - 1);
    S.ringUsedThisTurn = true;
    log(
      S,
      "Used an Elven Ring: changed a " +
        from +
        " die to " +
        d.face +
        " (rule 36). Rings left: " +
        S.board.rings +
        ".",
    );
    return d;
  }

  // ---------- cards ----------
  function drawCard(S, deck) {
    const D = S.cards.decks[deck];
    if (!D.length) {
      const disc = S.cards.discards[deck];
      if (!disc.length) {
        log(S, "The " + deckName(deck) + " deck is empty.");
        return null;
      }
      S.cards.decks[deck] = shuffle(disc);
      S.cards.discards[deck] = [];
      log(S, "Reshuffled the " + deckName(deck) + " discards into a new deck.");
    }
    const id = S.cards.decks[deck].shift();
    if (deck === "F") S.cards.factionHand.push(id);
    else S.cards.hand.push(id);
    log(
      S,
      "Drew a " +
        deckName(deck) +
        " card (" +
        (deck === "F" ? S.cards.factionHand.length : S.cards.hand.length) +
        " in hand).",
    );
    return id;
  }
  function deckName(d) {
    if (d === "C") return "Character";
    return d === "S" ? "Strategy" : "Faction Event";
  }
  function handCounts(S) {
    return {
      C: handBy(S, "C").length,
      S: handBy(S, "S").length,
      total: S.cards.hand.length,
      F: S.cards.factionHand.length,
    };
  }
  function removeFromLists(S, id) {
    for (const l of [
      S.cards.hand,
      S.cards.factionHand,
      S.cards.table,
      S.cards.factionTable,
    ]) {
      const i = l.indexOf(id);
      if (i >= 0) {
        l.splice(i, 1);
        return true;
      }
    }
    return false;
  }
  function discardCard(S, id, why) {
    const c = byId[id];
    removeFromLists(S, id);
    S.cards.discards[c.deck].push(id);
    log(S, "Discarded “" + c.title + "”" + (why ? " — " + why : "") + ".", {
      card: id,
    });
  }
  function playCard(S, id, ctx) {
    const c = byId[id];
    const combat = !!ctx?.combat;
    removeFromLists(S, id);
    const onTable = ON_TABLE(id) && !combat;
    if (onTable) {
      (c.deck === "F" ? S.cards.factionTable : S.cards.table).push(id);
    } else if (c.deck !== "B") S.cards.discards[c.deck].push(id);
    delete S.playable[(combat ? "B:" : "") + id];
    log(
      S,
      (combat ? "Combat card: " : "Played: ") +
        "“" +
        c.title +
        "”" +
        (onTable ? " (stays on the table)" : "") +
        ".",
      { card: id, combat },
    );
    return c;
  }
  // Card effects that change Queller's hand, dice or board and are not steps on a flowchart page. Returns trail entries.
  const FACTION_PICK = ["Preferred card", "Faction in play"]; // rule 3 breaks the tie
  function resolveCardEffects(S, id, ctx) {
    const c = byId[id];
    const out = [];
    if (ctx?.combat) return out;
    const K = S.cards;
    if (c.effect === "servants") {
      if (K.decks.F.length < 3 && K.discards.F.length) {
        K.decks.F = K.decks.F.concat(shuffle(K.discards.F));
        K.discards.F = [];
      }
      const drawn = K.decks.F.splice(0, 3);
      const r = applyPriority(S, drawn, FACTION_PICK);
      if (r.chosen) {
        K.factionHand.push(r.chosen);
      }
      const rest = drawn.filter((x) => x !== r.chosen);
      K.decks.F = shuffle(K.decks.F.concat(rest, K.discards.F));
      K.discards.F = [];
      log(
        S,
        "Servants of Sauron: drew " +
          drawn.length +
          " Faction Event cards, kept one, reshuffled the rest and the discards into the deck.",
      );
      out.push({
        kind: "pri",
        text: "Servants of Sauron — keep one of " + drawn.length + " cards",
        items: FACTION_PICK.concat("Otherwise at random (rule 3)"),
        steps: r.steps,
        card: r.chosen,
      });
    } else if (c.effect === "hisWill") {
      const r = applyPriority(
        S,
        K.discards.F.filter((x) => x !== id),
        FACTION_PICK,
      );
      if (r.chosen) {
        K.discards.F.splice(K.discards.F.indexOf(r.chosen), 1);
        K.factionHand.push(r.chosen);
        log(
          S,
          "His Will and His Malice: “" +
            byId[r.chosen].title +
            "” returned from the discard pile to the hand.",
        );
      } else
        log(
          S,
          "His Will and His Malice: no Faction Event card in the discard pile.",
        );
      out.push({
        kind: "pri",
        text: "His Will and His Malice — take a card from the Faction discard pile",
        items: FACTION_PICK.concat("Otherwise at random (rule 3)"),
        steps: r.chosen ? r.steps : ["Discard pile empty"],
        card: r.chosen,
      });
    } else if (c.effect === "lidlessEye" && S.settings.dice) {
      const chosen = nonPreferredFirst(
        S,
        availDice(S).filter((d) => d.k === "A"),
        3,
      );
      const from = chosen.map((d) => d.face);
      for (const d of chosen) {
        d.face = "Eye";
        d.st = DIE_STATE.HUNT;
        S.dice.hunt++;
      }
      let logText = "no unused die to change.",
        noteText = "no unused die to change";
      if (chosen.length) {
        const one = chosen.length === 1;
        logText =
          "changed " +
          from.join(", ") +
          " to Eye and placed " +
          (one ? "it" : "them") +
          " in the Hunt box.";
        noteText =
          chosen.length +
          " " +
          (one ? "die" : "dice") +
          " (" +
          from.join(", ") +
          ") to the Hunt box, non-preferred results first (rule 23)";
      }
      log(S, "The Lidless Eye: " + logText);
      out.push({ kind: "note", text: "The Lidless Eye: " + noteText });
    } else if (c.effect === "recruitFaction") {
      const k = c.faction.toLowerCase();
      if (!S.board.factions[k]) {
        S.board.factions[k] = true;
        S.playable = {};
        log(
          S,
          c.faction +
            " are now in play (tracker updated; the Faction die joins the pool next turn).",
        );
        out.push({
          kind: "note",
          text: c.faction + " enter play — tracker updated",
        });
      }
    }
    // The Palantír of Orthanc: after an Event die plays an Event card, draw another card (a preferred one: Character under the corruption strategy, Strategy under military).
    if (
      ctx?.die === "Event" &&
      (c.deck === "C" || c.deck === "S") &&
      ctx.palantirBefore
    ) {
      const deck = S.strategy === "corruption" ? "C" : "S";
      const got = drawCard(S, deck);
      log(
        S,
        "The Palantír of Orthanc: drew a " +
          deckName(deck) +
          " card after playing “" +
          c.title +
          "” with an Event die.",
      );
      out.push({
        kind: "note",
        text:
          "The Palantír of Orthanc: drew a " +
          deckName(deck) +
          " card" +
          (got ? "" : " — deck empty"),

  }
  // Table cards whose discard condition the board tracker can see. `check` returns true (discard now), false, or a question to ask the player.
  const TABLE_TRIGGERS = [
