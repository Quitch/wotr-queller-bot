name: Bug report
description: "The app did something wrong: a step that makes no sense, a card or die handled wrongly, a button that does nothing."
labels: [bug]
assignees: [Quitch]
body:
  - type: markdown
    attributes:
      value: |
        Every bug report needs a debug log. Without it the maintainer cannot see the game state and the actions that led to the fault.

        **How to get one.** In the app, open **Settings** (in the **Tools** menu on a narrow screen) and press **Export debug log**. The same button is on the New game screen and on the red error bar after a crash. In the Debug log window, press **Download debug log** (the "What went wrong?" box is optional; this form asks the same questions). Attach the downloaded file below. If GitHub does not accept the `.json` file, rename it to `.txt` or zip it.

        **If nothing downloads.** If the window shows **Share debug log file** (some phones and browsers), press it and save the file (for example with Save to Files) or attach it from the share sheet. Otherwise press **Copy debug log** (or select all in the text area and copy it), paste it into a new text file, save it as `.txt` and attach that file. If you cannot make a file, for example on a phone, paste the log into the Debug log field between two lines of three backticks (```), so GitHub shows it as it is. GitHub rejects a report longer than 65,536 characters, so this works only for a short log. If GitHub says the report is too long, paste the log into a secret gist at gist.github.com and put the gist's link in the field.

        **What is in it.** The app version, the game state, your last actions, any errors, and your browser's user agent, language, screen size and time zone. No personal details. It shows Queller's hidden cards, so only read it if you do not mind seeing them.

        Export the log as soon as the fault happens. Undo, starting a new game or loading a save changes what the log records.
  - type: textarea
    id: steps
    attributes:
      label: What were you doing?
      description: The phase, and the last few things you pressed or answered.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: The rule or the flowchart step, if you know it; otherwise what you thought the app would do.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Quote the step text exactly, if there was one.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Does it happen again?
      description: Export the debug log before you try the steps again; Undo or a new game changes what it records.
      options:
        - Every time I repeat the steps
        - Sometimes
        - It did not happen again when I repeated the steps
        - I have not tried
    validations:
      required: false
  - type: textarea
    id: debug_log
    attributes:
      label: Debug log
      description: Drag the `queller-debug-…json` file here (downloaded or shared, or the `.txt` file you saved) and wait until the upload shows as a link. If GitHub refuses the `.json` file, rename it to `.txt` or zip it. If you cannot attach a file, see **If nothing downloads** above.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (needed for layout or display problems)
      description: The log records the step text but not how the page looks.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version
      description: In the log under `app.version`, or during a game in **Settings › About** (Settings is in the **Tools** menu on a narrow screen). The README header line gives the latest published version.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: The debug log is attached, pasted or linked above.
          required: true
        - label: I know the log shows Queller's hidden cards.
          required: false
