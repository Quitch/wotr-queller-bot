name: Bug report
description: "The app did something wrong: a step that makes no sense, a card or die handled wrongly, a button that does nothing."
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Every bug report needs a debug log. Without it the maintainer cannot see the game state and the actions that led to the fault.

        **How to get one.** In the app, open **Settings** (in the **Tools** menu on a narrow screen) and press **Export debug log**. The same button is on the New game screen and on the red error bar after a crash. In the Debug log window, type what went wrong in the box (it is saved into the log), then press **Download debug log**. Attach the downloaded file below. If GitHub does not accept the `.json` file, rename it to `.txt` or zip it.

        **If nothing downloads.** Press **Copy debug log** (or select all in the text area and copy it), paste it into a new text file, save it as `.txt` and attach that file. If you cannot make a file, for example on a phone, paste the log into the Debug log field instead. GitHub rejects a report longer than 65,536 characters, so pasting works only for a short log.

        **What is in it.** The app version, the game state, your last actions, any errors, and your browser's user agent, language, screen size and time zone. No personal details. It shows Queller's hidden cards, so only read it if you do not mind seeing them.

        Export the log as soon as the fault happens. Undo, starting a new game or loading a save changes what the log records.
  - type: textarea
    id: steps
    attributes:
      label: What were you doing?
      description: The phase, and the last few things you pressed or answered.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: The rule or the flowchart step, if you know it; otherwise what you thought the app would do.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Quote the step text exactly.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Does it happen again?
      options:
        - Every time I repeat the steps
        - Sometimes
        - Only once
        - I have not tried
    validations:
      required: false
  - type: textarea
    id: debug_log
    attributes:
      label: Debug log
      description: Drag the `queller-debug-…json` file here (or the `.txt` file you saved) and wait until the upload shows as a link. If GitHub refuses the `.json` file, rename it to `.txt` or zip it. Paste the log only if you cannot attach a file; a long log is too large to paste.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (needed for layout or display problems)
      description: The log records the step text but not how the page looks.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version
      description: In **Settings › About**, on the README header line, or in the log under `app.version`.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: The debug log is attached or pasted above.
          required: true
        - label: I know the log shows Queller's hidden cards.
          required: false
