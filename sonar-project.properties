# SonarQube Cloud, CI-based analysis (the sonar step in .github/workflows/verify.yml runs the scanner after
# `npm run coverage`, which writes the LCOV report the coverage figure comes from).
sonar.projectKey=Quitch_wotr-queller-bot
sonar.organization=quitch
sonar.sources=src,scripts,build.js
sonar.tests=test
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Generated arrow routing (see CLAUDE.md); regenerated by npm run anchors, never edited.
sonar.exclusions=src/flow/anchors.json
# The page entry point only runs in a browser (its side effects are exercised by test/smoke.js, outside the LCOV report).
# The DOM wiring runs only in a browser too (CLAUDE.md: boot, the modal framework, wire.js and the tooltip are left to
# the Playwright scripts), so those modules are outside the LCOV report as well.
sonar.coverage.exclusions=src/main.js,src/ui/boot.js,src/ui/wire.js,src/ui/tooltip.js,src/modals/framework.js
